      const RAW_TEXT_DATA = String.raw`### Group 1: Gestational Hypertension, Preeclampsia, and HELLP Syndrome (ADPIE, ABC, Safety)

**1. A pregnant client at 34 weeks gestation presents to the clinic with a BP of 145/95 mm Hg and 2+ proteinuria. The nurse recognizes these findings as the classic diagnostic dyad for which condition? (Assessment/Analysis)**
A. Eclampsia
B. Gestational Hypertension (GH)
C. Pre-eclampsia
D. Chronic Hypertension
**Correct Answer: C.** Pre-eclampsia is characterized by hypertension (BP $\geq$ 140/90 after 20 wks gest) and proteinuria (1+ / 2+). GH is hypertension without proteinuria.

**2. A client diagnosed with severe preeclampsia reports epigastric pain in the right upper quadrant (RUQ). The nurse understands that this symptom is primarily related to which underlying pathophysiological mechanism? (Assessment/Analysis/Safety)**
A. Cerebral edema leading to capillary rupture
B. Arteriolar vasospasm causing visual disturbances
C. Intra-hepatic pressure from fibrin deposits
D. Pulmonary edema resulting in crackles
**Correct Answer: C.** RUQ epigastric pain is a clinical sign resulting from intra-hepatic pressure caused by congestion from fibrin deposits in the liver.

**3. A client with severe preeclampsia is admitted to the antepartum unit. Which nursing assessment finding indicates the most immediate threat to the client’s neurological status and requires immediate reporting? (Assessment/Safety/ABC)**
A. Deep Tendon Reflexes (DTRs) rated 3+
B. Oliguria (urine output $< 30 \text{ mL}/\text{hr}$)
C. Complaints of a headache (HA) and visual disturbances
D. Thrombocytopenia (platelets $< 100,000/\text{mm}^3$)
**Correct Answer: C.** Headache and visual disturbances are clinical signs of cerebral vasospasms and cerebral edema, indicating high risk for capillary rupture and Cerebral Hemorrhage (CVA) or Eclampsia (seizures).

**4. The nurse is caring for a preeclamptic client receiving IV fluids and monitoring hourly urine output (U.O.). The nurse understands that decreased U.O. (oliguria) is a clinical sign reflecting impaired perfusion to which maternal organ system? (Assessment/Analysis/ABC)**
A. Central Nervous System (CNS)
B. Uteroplacental unit
C. Renal system
D. Hepatic system
**Correct Answer: C.** Oliguria is listed as a clinical sign related to renal system impairment, specifically decreased renal perfusion and a lowered Glomerular Filtration Rate (GFR) due to tissue damage from arteriolar vasospasms.

**5. The nurse notes that a client with preeclampsia is exhibiting clonus along with DTRs measured at 3+. The primary concern for the nurse should be anticipating the onset of which complication? (Assessment/Safety)**
A. Disseminated Intravascular Coagulopathy (DIC)
B. HELLP syndrome
C. Placental abruption
D. Eclampsia
**Correct Answer: D.** Hyperreflexia (DTRs = 3+ / +clonus) are severe clinical symptoms associated with CNS irritability and precede Eclampsia (seizures).

**6. When reviewing the labs for a client with HELLP syndrome, the nurse expects to see evidence of which hematologic finding? (Assessment/Analysis)**
A. Increased Hgb and Hct
B. Microangiopathic Hemolytic Anemia (MAHA)
C. Increased consumption of clotting factors
D. Elevated Fibrin Split Products (FSP)
**Correct Answer: B.** HELLP includes Hemolytic anemia and Microangiopathic Hemolytic Anemia (MAHA), characterized by the damage of RBCs (schistocytes) through constricted blood vessels. (C and D are associated with DIC, which can result from HELLP).

**7. A nurse is planning care for a client admitted with a diastolic blood pressure of 102 mm Hg and preeclampsia. Based on this finding, the priority nursing intervention should be: (Planning/Implementation/Safety)**
A. Preparing the client for discharge with instructions for home blood pressure monitoring.
B. Initiating strict bed rest (BR) and seizure precautions.
C. Administering Hydralazine immediately via IV bolus.
D. Checking for anxiety and sleep deprivation.
**Correct Answer: B.** A diastolic BP $\geq$ 100 mm Hg indicates hospitalization and initiation of bed rest (BR). Seizure precautions are also essential.

**8. For a client with severe preeclampsia, the nurse identifies that the greatest risk to the fetus is: (Analysis/Safety)**
A. Intrauterine growth restriction (IUGR).
B. Hyperflexia.
C. Fetal death due to placental abruption.
D. Oliguria.
**Correct Answer: C.** Severe preeclampsia can progress to placental abruption, a condition that threatens fetal viability and is associated with fetal death. Fetal hypoxia and IUGR are significant risks, but fetal death is the gravest outcome.

**9. The nurse recognizes that the fundamental pathophysiology that leads to Gestational Hypertension (GH) is: (Analysis)**
A. Prostaglandin imbalance causing systemic vasodilation.
B. Tissue ischemia leading to maternal organ damage.
C. Arteriolar vasospasm leading to constriction of blood vessels.
D. Colloids leaking through damaged capillary walls.
**Correct Answer: C.** The process starts with a possible prostaglandin imbalance leading to arteriolar vasospasm, which causes constriction of blood vessels and resultant hypertension (BP $\geq$ 140/90 p 20 wks gest).

**10. A pregnant client has experienced generalized edema, proteinuria, and hypertension. The nurse knows that the deposition of fibrin and platelets at the site of endothelial injury will ultimately lead to which two immediate consequences? (Analysis)**
A. Hypovolemia and shock
B. Tissue ischemia and hypoxia
C. Hemoconcentration and oliguria
D. Cerebral edema and intravascular clotting
**Correct Answer: B.** After colloids leak and fibrin/platelets deposit, the sequence of events is tissue ischemia and hypoxia, followed by maternal organ damage and impaired fetal development.

**11. The nurse understands that which is a hallmark finding associated with the hematologic consequences of preeclampsia? (Assessment/Analysis)**
A. Increased circulating blood volume
B. Increased fetal heart rate (FHR)
C. Damage to RBCs resulting in schistocytes
D. Premature aging of the placenta
**Correct Answer: C.** Damage to RBCs passing through constricted blood vessels results in abnormally shaped Burr cells and damaged RBCs (schistocytes), leading to MAHA, a component of HELLP syndrome.

**12. When evaluating a preeclamptic client’s risk for developing Disseminated Intravascular Coagulopathy (DIC), the nurse would prioritize monitoring which laboratory value? (Assessment/Safety)**
A. Serum creatinine levels
B. Liver Function Tests (LFTs)
C. Fibrin Split Products (FSP)
D. Hemoglobin and Hematocrit (Hgb/Hct)
**Correct Answer: C.** Increased Fibrin Split Products (FSP) or FDP (fibrin degradation products) indicate the breakdown of fibrin, which is a key marker for the over-activation of the clotting cascade seen in DIC.

**13. The nurse understands that the definitive cure for Pregnancy-Induced Hypertension (PIH) is: (Planning/Analysis)**
A. Strict bed rest (BR).
B. Delivery of the fetus and placenta.
C. Administration of Magnesium Sulfate.
D. Hydralazine therapy to reduce BP.
**Correct Answer: B.** The only cure listed for PIH is the delivery of the fetus and placenta.

**14. A nurse is conducting a detailed medical history (Hx) for a newly admitted primigravida client. Which finding places her at the highest risk for developing Gestational Hypertension (GH)? (Assessment/Analysis)**
A. Gestational age of 28 weeks
B. Obesity prior to pregnancy
C. History of pre-existing asthma
D. Maternal age of 25 years old
**Correct Answer: B.** Obesity is listed as a predisposing factor for GH, along with primigravida status.

**15. A client with preeclampsia is experiencing severe hyperflexia and has DTRs of 3+ with clonus. Which immediate safety measure should the nurse implement? (Implementation/Safety)**
A. Place the client in a left side-lying position.
B. Administer a sedative such as phenobarbital.
C. Institute seizure precautions.
D. Prepare for a STAT C-section.
**Correct Answer: C.** Seizure precautions (including padding side rails (SR’s) and removing breakable items) are primary nursing care interventions for managing CNS irritability and preventing injury in a client at high risk for Eclampsia.

***

### Group 2: Magnesium Sulfate and Tocolytics (Safety, Implementation, ABC)

**16. The nurse prepares to administer a loading dose of Magnesium Sulfate (MgSO4) to a preeclamptic client. The rationale for this medication is primarily to: (Implementation/Analysis/Safety)**
A. Decrease peripheral vascular resistance to lower BP.
B. Prevent seizures by decreasing CNS irritability.
C. Block muscle excitability to induce therapeutic rest.
D. Increase circulating blood volume to improve renal perfusion.
**Correct Answer: B.** MgSO4 is the drug of choice (DOC) used for pre-eclamptic patients to prevent seizures by depressing the CNS and decreasing CNS irritability.

**17. A client is receiving a continuous intravenous infusion of MgSO4 at $2 \text{ gm}/\text{hr}$. Which nursing assessment finding indicates that the client is experiencing a common side effect of the medication? (Assessment/Analysis)**
A. Flaccid paralysis
B. Respiratory rate (RR) of 10 breaths/min
C. Dizziness and flushing
D. Urine output of $20 \text{ mL}/\text{hr}$
**Correct Answer: C.** Common side effects of MgSO4 include dizziness, flush, nausea, and drowsiness. Respiratory depression (RR $< 12$ or $\downarrow\text{ RR}$ is a serious side effect).

**18. The therapeutic serum magnesium level range that the nurse should monitor for in a client receiving MgSO4 is: (Assessment)**
A. $1.5 \text{ to } 2.5 \text{ mg/dl}$.
B. $4 \text{ to } 7 \text{ mg/dl}$.
C. $8 \text{ to } 10 \text{ mg/dl}$.
D. $12 \text{ to } 15 \text{ mg/dl}$.
**Correct Answer: B.** The therapeutic range for Mg levels is $4\text{ to }7 \text{ mg}/\text{dl}$.

**19. A client receiving IV MgSO4 begins to show signs of serious toxicity, including diminished DTRs and a respiratory rate of $10 \text{ breaths}/\text{min}$. The priority nursing intervention should be to: (Implementation/Safety/ABC)**
A. Slow the continuous IV infusion rate to $1 \text{ gm}/\text{hr}$.
B. Administer Calcium Gluconate intravenously.
C. Increase the IV fluid rate to maintain blood pressure.
D. Notify the provider and prepare for intubation.
**Correct Answer: B.** Respiratory distress/depression and decreased DTRs are serious side effects of MgSO4. The specific antidote for MgSO4 toxicity (high $\text{Mg}^{++}$ and low $\text{Ca}^{++}$) is Calcium Gluconate.

**20. The nurse is administering Hydralazine (Apresoline) to a preeclamptic client to decrease blood pressure. The nurse understands that dropping the BP too rapidly could lead to which critical complication? (Safety/ABC)**
A. Increased maternal heart rate ($\text{P}$) and headache (HA)
B. Fetal hypoxia due to impaired uteroplacental function
C. Thrombocytopenia in the neonate
D. Severe maternal cerebral hemorrhage (CVA)
**Correct Answer: B.** The nurse must lower the BP gradually because dropping it too fast can impair uteroplacental function, leading to fetal hypoxia.

**21. The nurse is preparing to administer Terbutaline ($0.25 \text{ mg}$ SQ) to a client in preterm labor (PTL). Which maternal assessment finding requires the nurse to hold the medication and notify the provider? (Implementation/Assessment/Safety)**
A. Shortness of breath (SOB)
B. Tachycardia with an apical pulse (AP) of 115 beats/min
C. Complaints of chest pain (CP)
D. Decreased levels of potassium ($\text{K}^+$)
**Correct Answer: B.** Terbutaline should be held if the apical pulse (AP) is $\geq 110$. Tachycardia ($\text{AP} \geq 110$) is a common side effect, but the threshold to hold is explicitly stated. (SOB, CP, and decreased $\text{K}^+$ are serious side effects that must be reported, but the holding parameter is the priority check before administration).

**22. Terbutaline (a $\beta$-sympathomimetic) is administered to a client in preterm labor (PTL). The nurse monitors for side effects consistent with the drug’s action, which mimics the effects of which nervous system? (Assessment/Analysis)**
A. Parasympathetic Nervous System (PNS)
B. Central Nervous System (CNS)
C. Somatic Nervous System
D. Sympathetic Nervous System (SNS)
**Correct Answer: D.** Terbutaline is a $\beta$-sympathomimetic agent, meaning it mimics the effects of the Sympathetic Nervous System (SNS). Side effects include tachycardia ($\uparrow \text{P}$), restlessness (jitters), and hyperglycemia.

**23. The nurse is preparing to administer Indomethacin to a client with preterm labor (PTL). The nurse understands that this drug works primarily by performing which action? (Implementation/Analysis)**
A. Blocking calcium channels to relax the uterus
B. Inhibiting prostaglandin synthesis
C. Depressing CNS irritability
D. Increasing serum glucose levels
**Correct Answer: B.** Indomethacin (Indocin) is listed as a medication for PTL that works by inhibiting prostaglandin.

**24. The nurse knows that the main therapeutic benefit of giving Betamethasone (a corticosteroid) to a client in preterm labor at 32 weeks gestation is to: (Planning/Safety)**
A. Decrease uterine contractions (ucs).
B. Promote maternal glucose control.
C. Increase fetal surfactant production.
D. Improve the uteroplacental perfusion.
**Correct Answer: C.** Betamethasone is given when the fetus is $< 34$ weeks to increase fetal surfactant production, which is critical for lung development.

**25. A client is receiving MgSO4 for PTL. The nurse understands that the mechanism of action that makes this medication effective as a tocolytic is its ability to: (Analysis)**
A. Increase calcium uptake at the myoneural junction.
B. Act as an insulin antagonist to prevent hyperglycemia.
C. Decrease muscle excitability and relax smooth muscle.
D. Stimulate the autonomic nervous system.
**Correct Answer: C.** MgSO4 blocks acetylcholine at the myoneural junction and decreases muscle excitability. When used as a tocolytic (contraction inhibitor), it relaxes smooth muscle.

***

### Group 3: Fetal Monitoring and Uteroplacental Issues (ABC, Assessment, Implementation)

**26. The nurse observes a fetal heart rate (FHR) strip showing a baseline rate of $170 \text{ beats}/\text{min}$ with minimal variability. The most common maternal cause for this FHR pattern is: (Assessment/Analysis/Safety)**
A. Maternal hypotension
B. Maternal fever
C. Umbilical cord compression
D. Fetal cardiac dysrhythmias
**Correct Answer: B.** The FHR baseline of $170 \text{ beats}/\text{min}$ indicates fetal tachycardia ($\text{FHR} > 160 \text{ beats}/\text{min}$). Maternal fever or intraamniotic infection is the most common maternal cause of fetal tachycardia.

**27. A client’s FHR strip shows early decelerations during uterine contractions. The nurse understands this is a reassuring pattern caused by: (Assessment/Analysis)**
A. Uteroplacental insufficiency (UPI).
B. Umbilical cord compression (CC).
C. Fetal head compression (HC).
D. Maternal supine hypotension.
**Correct Answer: C.** Early decelerations are a reassuring pattern resulting from fetal head compression (HC), causing a vagal response.

**28. The nurse notes repetitive Variable Decelerations on the FHR monitor. Which intervention should the nurse perform first to improve fetal oxygenation and relieve the cause? (Implementation/ABC/Safety)**
A. Administer oxygen via non-rebreather mask at $10 \text{ L}/\text{min}$.
B. Initiate an amnioinfusion.
C. Change the maternal position.
D. Discontinue the Pitocin infusion.
**Correct Answer: C.** Variable decelerations are caused by umbilical cord compression (CC). Changing the maternal position (often to a lateral position) is the initial, priority intervention to relieve cord compression.

**29. The nurse observes Late Decelerations on the FHR strip during every contraction. The nurse immediately recognizes this non-reassuring pattern as a sign of: (Assessment/Analysis/ABC)**
A. Uteroplacental insufficiency (UPI).
B. Normal physiological response to contraction.
C. Intact central nervous system (CNS).
D. Fetal sleep cycle.
**Correct Answer: A.** Late decelerations are a non-reassuring pattern primarily caused by uteroplacental insufficiency (UPI).

**30. The nurse needs to assess the fetal viability and growth rate for a client with Gestational Diabetes Mellitus (GDM). Which non-invasive procedure is routinely used for this assessment? (Assessment/Planning)**
A. Chorionic Villus Sampling (CVS)
B. Amniocentesis
C. Contraction Stress Test (CST)
D. Ultrasound (U/S) and Biophysical Profile (BPP)
**Correct Answer: D.** U/S and BPP are used routinely in fetal surveillance for high-risk pregnancies like GDM to check fetal movement, volume, and growth.

**31. The nurse is reviewing an FHR strip and notes a baseline FHR of $130 \text{ bpm}$ with FHR accelerating to $145 \text{ bpm}$ for $20 \text{ seconds}$ with fetal movement. This pattern is interpreted as: (Assessment/Analysis)**
A. Non-reassuring due to lack of uterine activity.
B. Reactive, indicating fetal well-being.
C. Bradycardia with marked variability.
D. Minimal variability, requiring further investigation.
**Correct Answer: B.** A reactive Non-stress Test (NST) requires two or more accelerations of $15 \text{ beats}/\text{min}$ or more for $15 \text{ seconds}$ or more over a $20 \text{ minute}$ period, indicating fetal well-being and an intact CNS.

**32. A pregnant client is undergoing a Contraction Stress Test (CST). The nurse reports a positive CST to the provider if the monitor displays: (Assessment/Analysis)**
A. Repetitive Variable Decelerations.
B. Late Decelerations.
C. Early Decelerations.
D. FHR Accelerations.
**Correct Answer: B.** A positive CST is defined by the presence of Late Decelerations, which signify that the fetus cannot tolerate the stress of contractions.

**33. Variability is the normal irregularity of the cardiac rhythm, resulting from the push-pull effect of the autonomic nervous system. Moderate variability (6-25 bpm) is considered: (Assessment/Analysis)**
A. Non-reassuring, associated with CNS depressants.
B. Reassuring, indicating an intact nerve pathway.
C. Marked, associated with fetal stimulation.
D. Absent, indicating fetal acidemia.
**Correct Answer: B.** Moderate variability (6-25 bpm) is the desired finding, reflecting an intact nerve pathway and reassuring fetal status.

**34. The nurse understands that minimal variability ($< 5 \text{ bpm}$) on an FHR strip, when sustained and not due to a sleep cycle, is concerning because it is associated with: (Assessment/Analysis/Safety)**
A. Early mild hypoxemia.
B. Fetal stimulation and activity.
C. Hypoxia/acidosis.
D. Maternal hypertension.
**Correct Answer: C.** Decreased or minimal variability ($< 5 \text{ bpm}$) is a non-reassuring sign often associated with fetal hypoxia or acidosis.

**35. A nurse prepares a client for an amniocentesis procedure. The nurse knows that the earliest gestational age this procedure is typically performed is: (Planning)**
A. $10 \text{ weeks}$.
B. $14 \text{ weeks}$.
C. $20 \text{ weeks}$.
D. $34 \text{ weeks}$.
**Correct Answer: B.** Amniocentesis is typically done earliest at $\cong 14 \text{ weeks}$ gestation.

**36. A nurse teaches a pregnant client how to perform Daily Fetal Movement Counts (DFMC). The nurse instructs the client to notify the provider if she feels fewer than how many movements in two hours? (Planning/Safety)**
A. Less than 1 movement
B. Less than 2 movements
C. Less than 5 movements
D. Less than 10 movements
**Correct Answer: B.** Normal DFMC is $2\text{ to }10 \text{ movements}$ in $2 \text{ hours}$ (or $< 3 / \text{hr}$), so reporting less than 2 movements would be the safest threshold based on the low end of the expected range.

**37. When assessing a client’s Biophysical Profile (BPP) score, the nurse understands that a score of 8/8 (or 10/10) is interpreted as: (Assessment/Analysis)**
A. Abnormal fetal status requiring intervention.
B. Optimal fetal outcome.
C. Indication for immediate delivery.
D. Non-reassuring fetal compromise.
**Correct Answer: B.** A BPP score of 8 out of 8 or 10 out of 10 is considered optimal and indicates a better outcome/presentation of the baby.

**38. The nurse notes the Amniotic Fluid Index (AFI) reading on a client’s ultrasound is $3 \text{ cm}$. The nurse understands this finding classifies the client’s fluid status as: (Assessment/Analysis)**
A. Polyhydramnios
B. Normal
C. Oligohydramnios
D. Premature rupture of membranes (PROM)
**Correct Answer: C.** An AFI $< 5 \text{ cm}$ indicates oligohydramnios.

**39. If the FHR strip shows repetitive Late Decelerations (UPI), the nurse’s priority intervention to address maternal circulation should be: (Implementation/ABC/Safety)**
A. Prepare for an immediate C-section.
B. Increase the rate of IV fluids (e.g., Lactated Ringer's).
C. Discontinue the Pitocin.
D. Administer oxygen $8\text{ to }10 \text{ L}/\text{min}$ via non-rebreather mask.
**Correct Answer: B.** While all interventions are part of intrauterine resuscitation, increasing IV fluids ($\uparrow\text{ LR}$) addresses the $\text{C}$ (Circulation) component by improving maternal blood pressure and plasma volume, which often precedes oxygen administration and positioning changes when addressing UPI/hypotension.

**40. A client with a prior classic uterine incision is admitted to the labor unit. The nurse anticipates that a trial of labor (TOL) or induction is: (Planning/Safety)**
A. Contraindicated due to the high risk of uterine rupture.
B. Recommended to assess the safety of a SVD.
C. Indicated only if the Bishop score is $\geq 10$.
D. Allowed if the fetus is vertex and engaged.
**Correct Answer: A.** A prior classic uterine incision is a contraindication for a trial of labor, VBAC, or induction due to the increased risk of uterine rupture.

### Group 4: Bleeding in Pregnancy/Hemorrhage & Shock (ABC, Assessment, Implementation, Safety)

**41. The nurse is caring for a client with Placenta Previa. Which characteristic finding is the nurse most likely to assess? (Assessment)**
A. Painless, bright red vaginal bleeding.
B. Rigid, tender abdomen with severe pain.
C. Dark brown, scant bleeding with passage of hydropic vesicles.
D. Severe, sharp unilateral abdominal pain.
**Correct Answer: A.** Placenta previa is characterized by painless uterine bleeding, which is often bright red and may be intermittent.

**42. A client experiences a total delivery room blood loss (EBL) of $1,300 \text{ mL}$ following a spontaneous vaginal delivery (SVD). The nurse recognizes this finding meets the criteria for: (Analysis)**
A. Normal quantitative blood loss (QBL) for SVD.
B. Hemorrhagic shock.
C. Postpartum hemorrhage (PPH).
D. Disseminated intravascular coagulopathy (DIC).
**Correct Answer: C.** PPH is defined as postpartum blood loss $> 1000 \text{ mL}$, independent of the mode of birth. Normal EBL for SVD is $< 500 \text{ mL}$.

**43. A client presents to the Emergency Department complaining of severe, sharp abdominal pain and minimal vaginal bleeding. She reports recent cocaine use. The nurse recognizes these symptoms are most consistent with: (Assessment/Analysis/Safety)**
A. Spontaneous Abortion (SAB)
B. Hydatidiform Mole
C. Placenta Previa
D. Abruptio Placentae
**Correct Answer: D.** Abruptio placentae is often associated with cocaine use and presents with abdominal pain (uterine hypertonicity/tetany) and may involve concealed hemorrhage (minimal or no vaginal bleeding).

**44. The most common cause of Postpartum Hemorrhage (PPH) is: (Analysis)**
A. Retained placental fragments.
B. Uterine lacerations.
C. Uterine atony.
D. MgSO4 administration.
**Correct Answer: C.** Uterine atony (hypotonia of the uterus) is the most common cause of PPH.

**45. Following the delivery of the placenta, the nurse assesses the fundus and finds it to be boggy and displaced to the right. The priority nursing intervention is: (Implementation/Safety/ABC)**
A. Palpate the suprapubic area for a distended bladder.
B. Initiate vigorous fundal massage.
C. Administer Pitocin IV to increase uterine contractions.
D. Elevate the client's lower extremities.
**Correct Answer: B.** For uterine atony (boggy uterus), the primary, immediate goal is to increase uterine contractions ($\uparrow \text{ucs}$) and decrease blood loss. This is done first by initiating fundal massage.

**46. A client in the fourth stage of labor who had an epidural has profuse vaginal bleeding, but her fundus is firm and midline. The nurse suspects the bleeding is most likely due to: (Assessment/Analysis)**
A. Uterine atony.
B. Distended bladder.
C. Laceration of the birth canal.
D. Retained placental fragments.
**Correct Answer: C.** PPH with a firmly contracted uterus is a classic sign of a laceration of the birth canal.

**47. When a client experiences hemorrhagic (hypovolemic) shock, the initial physiological compensatory response involves the release of catecholamines leading to: (Analysis/ABC)**
A. Vasodilation and decreased cardiac output.
B. Vasoconstriction, shunting blood to the brain and heart.
C. Tissue hypoxia and metabolic alkalosis.
D. Consumption of clotting factors leading to DIC.
**Correct Answer: B.** Catecholamine release causes vasoconstriction, which shunts blood away from non-vital organs (like the kidneys) to the brain and heart only to maintain life.

**48. An immediate intervention for hemorrhagic shock is to restore blood volume. Which fluid component should the nurse prioritize to replace lost clotting factors and reverse DIC? (Implementation/ABC)**
A. Packed Red Blood Cells (PRBCs)
B. Fresh Frozen Plasma (FFP)
C. Lactated Ringer's (LR)
D. Whole Blood
**Correct Answer: B.** FFP contains clotting factors and is necessary to reverse DIC (a common complication of severe hemorrhage).

**49. A client reports unilateral cramps and tenderness followed by sudden, sharp abdominal pain. The nurse suspects an Ectopic Pregnancy. The primary cause of maternal death in this condition is: (Analysis/Safety)**
A. Infection (septicemia).
B. Hyperglycemia.
C. Hemorrhage.
D. Pulmonary Embolism (PE).
**Correct Answer: C.** Ectopic pregnancy is a medical urgency, and $10\%$ of all maternal deaths are primarily due to hemorrhage (especially if the tube ruptures).

**50. The nurse suspects a client is experiencing Disseminated Intravascular Coagulopathy (DIC). Which is a late clinical manifestation of this condition? (Assessment/Analysis)**
A. Sudden, sharp abdominal pain
B. Petechiae and bleeding from the gums
C. Headache and visual disturbances
D. Fetal tachycardia
**Correct Answer: B.** DIC is characterized by widespread internal and/or external bleeding, often presenting as unusual bleeding, petechiae, or spontaneous bleeding from the gums and nose due to the consumption of clotting factors and platelets.

**51. A client with an Ectopic Pregnancy experiences internal bleeding. Which sign should alert the nurse to the possibility of internal hemorrhage? (Assessment/Safety/ABC)**
A. Increased blood pressure (BP) and bounding pulse (P)
B. Vertigo, shoulder pain, and tachycardia
C. Elevated white blood cell count (WBC) and low-grade temperature
D. Absence of vaginal bleeding
**Correct Answer: B.** Signs of internal bleeding indicative of hypovolemic shock include vertigo, referred shoulder pain (from blood in the peritoneum), and compensatory tachycardia.

**52. The nurse reviews the chart of a client diagnosed with Abruptio Placentae, Grade III. Which finding should the nurse prioritize when anticipating immediate management? (Assessment/Analysis/ABC)**
A. Vaginal bleeding less than $500 \text{ mL}$
B. Maternal shock and fetal demise
C. Uterine tenderness and mild tetany
D. Fetal distress without maternal shock
**Correct Answer: B.** Grade III Abruption is characterized by severe findings, including maternal shock (coagulopathy) and fetal death. (C and D represent Grade I/II, and A is unreliable due to possible concealed hemorrhage).

**53. A client is diagnosed with a Complete Hydatidiform Mole. The nurse includes teaching that this condition carries a $20\%$ risk for which malignant condition? (Planning/Analysis/Safety)**
A. Liver rupture
B. Cerebrovascular accident (CVA)
C. Choriocarcinoma
D. Renal failure
**Correct Answer: C.** Complete moles carry a $20\%$ risk of developing choriocarcinoma.

**54. A client who is Rh-negative experiences a spontaneous abortion (SAB) at 10 weeks gestation. The nurse plans to administer RhoGAM. The primary rationale for this intervention is to prevent: (Planning/Implementation/Safety)**
A. Future isoimmunization problems in the next pregnancy.
B. Excessive maternal hemorrhage during the SAB.
C. Maternal-fetal blood mixing during the current pregnancy.
D. The risk of developing disseminated intravascular coagulopathy (DIC).
**Correct Answer: A.** RhoGAM is given to Rh-negative mothers experiencing any fetal or embryonic loss (like an abortion) to prevent the development of maternal antibodies, which would cause isoimmunization in subsequent pregnancies.

**55. A client who had an SVD 5 days ago calls the clinic complaining of heavy, bright red vaginal bleeding (lochia rubra) that has persisted since birth. The nurse suspects that the primary cause is: (Assessment/Analysis)**
A. Normal involution process.
B. Postpartum infection.
C. Retained placental fragments.
D. Uterine sub-involution.
**Correct Answer: C.** Persistent lochia rubra (bright red blood) beyond 3 days postpartum suggests retained placental fragments or bleeding at the placental site.

***

### Group 5: Preterm Labor, PROM, and Incompetent Cervix (Safety, Planning, Implementation)

**56. The nurse is teaching a client to identify the signs of preterm labor (PTL). The nurse should instruct the client to seek medical evaluation if she experiences regular contractions at a frequency of: (Planning/Assessment/Safety)**
A. Every 10 minutes or more for one hour.
B. Every 2 to 3 minutes, lasting 60 to 90 seconds.
C. Fewer than 6 contractions per hour.
D. Irregular contractions accompanied by backache.
**Correct Answer: A.** Preterm labor is defined by regular uterine contractions (ucs) every 10 minutes or more for one hour, causing cervical changes.

**57. A client is admitted with premature rupture of membranes (PROM) at 35 weeks gestation. The priority nursing goal is to prevent the most serious complication of this condition, which is: (Planning/Safety)**
A. Uteroplacental insufficiency (UPI).
B. Amnionitis (ascending infection).
C. Cord compression leading to variable decelerations.
D. Oligohydramnios leading to fetal hypoxia.
**Correct Answer: B.** PROM poses a high risk for ascending infection (amnionitis or chorioamnionitis), which can lead to neonatal sepsis.

**58. When assessing a client who reports fluid leaking from her vagina, the nurse performs a Nitrazine test. The nurse suspects the fluid is amniotic fluid if the Nitrazine paper turns: (Assessment)**
A. Red.
B. Blue.
C. Yellow.
D. Green.
**Correct Answer: B.** A positive Nitrazine test (litmus paper) turns blue, indicating the fluid is alkaline (amniotic fluid is typically alkaline, whereas vaginal secretions are acidic).

**59. A client diagnosed with Incompetent Cervix is scheduled for a cervical cerclage procedure. The nurse should explain that the primary purpose of this procedure is to: (Planning/Implementation/Safety)**
A. Prevent postpartum hemorrhage (PPH) by manually closing the cervix.
B. Decrease uterine contractions and prevent preterm labor.
C. Surgically constrict the internal cervical os to maintain the pregnancy.
D. Induce labor before the membranes spontaneously rupture (SROM).
**Correct Answer: C.** A cervical cerclage is a surgical procedure, such as the McDonald cerclage, that involves placing a band/suture around the cervix beneath the mucosa to constrict the internal os.

**60. A client with an Incompetent Cervix who recently had a cerclage placed should be taught to immediately report signs and symptoms of: (Planning/Safety)**
A. Progressive generalized edema.
B. Onset of true labor (increasingly regular, strong contractions).
C. Fetal movement counts less than 10 in 2 hours.
D. Hyperreflexia and clonus.
**Correct Answer: B.** If true labor begins, the increasing uterine pressure might rupture the uterus or cause the suture to tear the cervix. The cerclage must be removed if she goes into labor.

**61. When teaching a client who is diagnosed with a Hydatidiform Mole about home care after evacuation, the most critical education point should be: (Planning/Safety)**
A. Avoid heavy lifting for one week.
B. Use effective contraception for one year.
C. Monitor for fever and signs of infection.
D. Report any bright red bleeding immediately.
**Correct Answer: B.** Following evacuation of a molar pregnancy, the client must use reliable contraception for one year to monitor for rising HCG levels that could indicate choriocarcinoma.

**62. A client who is at 30 weeks gestation is admitted with preterm labor. The physician orders IV hydration. The rationale for increasing fluid intake in this scenario is to: (Implementation/Analysis)**
A. Increase maternal glucose levels to meet fetal demands.
B. Decrease uterine irritability and stop contractions.
C. Prevent placental abruption.
D. Reverse hypovolemic shock.
**Correct Answer: B.** Hydration is a crucial intervention for PTL because dehydration or inadequate plasma volume can cause uterine irritability and lead to contractions.

**63. When caring for a client in PTL who is on strict bed rest (BR), the priority nursing intervention should focus on preventing complications related to: (Implementation/Safety/ABC)**
A. Hemorrhage and DIC.
B. Incompetent cervix.
C. Hazards of immobility.
D. Substance abuse withdrawal.
**Correct Answer: C.** Hazards of immobility (e.g., thromboembolism, muscle atrophy) are a key safety concern for clients placed on bed rest for PTL or GH.

**64. A nurse is planning care for a client at 34 weeks gestation diagnosed with Placenta Previa. Which intervention should be avoided? (Planning/Safety)**
A. Detailed history and focused assessment.
B. Non-stress test (NST) and Biophysical Profile (BPP).
C. Routine sterile vaginal examination (SVE).
D. Preparing for a C-section if active management is needed.
**Correct Answer: C.** Vaginal examinations should be avoided if placenta previa is suspected or confirmed due to the risk of causing acute hemorrhage.

**65. A client in preterm labor is confirmed positive for Group B $\beta$-Streptococci (GBBS) during her third-trimester prenatal visits. The primary goal of managing this client during labor is to prevent: (Planning/Safety)**
A. Maternal uterine atony.
B. Neonatal sepsis and meningitis.
C. Placenta previa.
D. Maternal hemorrhagic shock.
**Correct Answer: B.** GBBS is the most common cause of neonatal sepsis and meningitis, making prophylactic antibiotics (e.g., penicillin/ampicillin) during labor critical to prevent neonatal exposure.

***

### Group 6: Maternal Diabetes (Assessment, Planning, Safety)

**66. The nurse is conducting prenatal teaching for a client with Type 1 Insulin-Dependent Diabetes Mellitus (IDDM). Which statement reflects the greatest risk to the fetus during organogenesis (weeks 2-8)? (Planning/Safety)**
A. Neonatal metabolic abnormalities (hypoglycemia)
B. Macrosomia leading to shoulder dystocia
C. Fetal congenital malformations (CNS/CV/GU/GI)
D. Pre-eclampsia and hypertension
**Correct Answer: C.** Uncontrolled maternal hyperglycemia (or acidosis) during the first trimester (weeks 2-8: period of embryonic development and organogenesis) significantly increases the risk of major congenital malformations.

**67. A nurse understands that during the second and third trimesters, a pregnant client with diabetes will experience increased insulin resistance primarily due to the placental production of: (Analysis)**
A. Progesterone and Estrogen.
B. Human Placental Lactogen (HPL) and Cortisol.
C. Human Chorionic Gonadotropin (HCG).
D. Insulinase (insulin antagonist).
**Correct Answer: D.** The placenta produces various hormones (HPL, Estrogen, Progesterone, Cortisol) which act as insulin antagonists, decreasing glucose tolerance. Insulinase is the enzyme that specifically decreases the effectiveness of insulin.

**68. When assessing the newborn of a diabetic mother (GDM), the nurse’s priority action should be to monitor for signs of which metabolic abnormality immediately after birth? (Assessment/ABC/Safety)**
A. Hyperglycemia
B. Hypoglycemia
C. Hyperbilirubinemia
D. Respiratory Distress Syndrome (RDS)
**Correct Answer: B.** When the cord is cut, the baby loses the maternal glucose supply but continues to hyper-produce its own insulin, leading to a sudden drop in glucose (hypoglycemia).

**69. The nurse recognizes that a fasting maternal blood glucose level should typically fall within which range during pregnancy? (Assessment)**
A. $60 \text{ to } 90 \text{ mg/dl}$
B. $70 \text{ to } 110 \text{ mg/dl}$
C. $110 \text{ to } 130 \text{ mg/dl}$
D. $140 \text{ to } 160 \text{ mg/dl}$
**Correct Answer: A.** Fasting blood glucose targets during pregnancy are $60\text{ to }90 \text{ mg}/\text{dl}$, which is lower than the typical non-pregnant adult range.

**70. A client with uncontrolled GDM develops Polyhydramnios (amniotic fluid $> 1500 \text{ mL}$). The nurse understands that this complication places the client at increased risk for which condition? (Analysis/Safety)**
A. Low birth weight (LBW) infant
B. Spontaneous abortion (SAB)
C. Postpartum hemorrhage (PPH)
D. Intrauterine growth restriction (IUGR)
**Correct Answer: C.** Polyhydramnios overdistends the uterus, making the uterine muscle less able to contract efficiently, which is a major risk factor for PPH.

**71. The nurse is teaching a diabetic client about the appropriate total weight gain during pregnancy. The recommended range is: (Planning)**
A. $15 \text{ to } 20 \text{ lbs}$.
B. $22 \text{ to } 30 \text{ lbs}$.
C. $35 \text{ to } 40 \text{ lbs}$.
D. No more than $10 \text{ lbs}$.
**Correct Answer: B.** The average total weight gain recommended for diabetic clients is $22\text{ to }30 \text{ lbs}$. (Normal non-diabetic range is $25\text{ to }35 \text{ lbs}$).

**72. Following delivery, the nurse notes that the client’s insulin requirements have dramatically decreased. The primary physiological reason for this change is: (Analysis)**
A. The postpartum period is highly stress-inducing, raising endogenous insulin.
B. The anti-diabetogenic effects of breastfeeding intensify.
C. The placenta (the source of insulin antagonists) has been delivered.
D. The liver automatically begins synthesizing adequate insulin.
**Correct Answer: C.** Delivery of the placenta removes the source of the insulin antagonists (like HPL and insulinase), rapidly returning the mother's sensitivity to insulin.

***

### Group 7: Obstetrical Emergencies & Labor Patterns (ABC, Implementation, Safety)

**73. A nurse responds to a Shoulder Dystocia in the delivery room. The priority action for the nurse to assist in the birth should be to: (Implementation/ABC/Safety)**
A. Apply firm fundal pressure to push the baby out.
B. Place the client in McRobert’s maneuver.
C. Prepare for an emergency C-section.
D. Coach the mother to push with sustained Valsalva maneuvers.
**Correct Answer: B.** McRobert’s maneuver (flexing legs apart with knees on the abdomen) is a primary intervention used to widen the pelvic outlet during shoulder dystocia. Fundal pressure should be avoided.

**74. During a vaginal exam, the nurse palpates the umbilical cord below the fetal presenting part. The immediate priority intervention to maintain fetal oxygenation is to: (Implementation/ABC/Safety)**
A. Place the client in the knee-chest position.
B. Administer oxygen $10 \text{ L}/\text{min}$ via non-rebreather mask.
C. Wrap the exposed cord in a wet sterile dressing.
D. Hold the presenting part off the cord.
**Correct Answer: D.** Prompt recognition of a Prolapsed Umbilical Cord is followed by the immediate intervention of using a hand to hold the presenting part off the cord to relieve compression and maintain blood flow.

**75. A client is experiencing a precipitous labor, progressing from $0 \text{ to } 10 \text{ cm}$ dilation in under 3 hours. The nurse understands that this rapid labor pattern puts the fetus at high risk for: (Assessment/Safety)**
A. Meconium aspiration syndrome (MAS).
B. Hypoxia and intracranial hemorrhage.
C. Respiratory distress syndrome (RDS).
D. Macrosomia.
**Correct Answer: B.** Precipitous labor involves hypertonic contractions (tetany), leading to rapid, forceful descent. This speed and intensity increase the risk of fetal hypoxia and intracranial hemorrhage.

**76. A client presents in active labor with contractions lasting $90 \text{ seconds}$ and occurring every minute. The nurse recognizes this labor pattern as: (Assessment/Analysis)**
A. Hypotonic uterine dysfunction.
B. Precipitous labor.
C. Hypertonic uterine dysfunction (Tetanic contractions).
D. Secondary arrest of dilation.
**Correct Answer: C.** Normal contractions should be $\sim 60\text{ to }90 \text{ seconds}$ long and occur every $2\text{ to }5 \text{ minutes}$. Contractions lasting $90 \text{ seconds}$ and coming every minute are too frequent and long, indicating hypertonic uterine dysfunction, often associated with tetany or precipitous labor.

**77. The nurse is monitoring a newborn who was born with meconium-stained amniotic fluid (MAS). The primary intervention to prevent MAS complications is performed by the provider at the perineum and involves: (Implementation/ABC/Safety)**
A. Initiating positive pressure ventilation (PPV).
B. Suctioning the newborn before the first breath.
C. Administering exogenous surfactant.
D. Preparing the newborn for extracorporeal membranous oxygenation (ECMO).
**Correct Answer: B.** For MAS, suctioning the newborn (using a bulb syringe or equivalent) at the perineum *before* the first breath is the critical intervention to prevent aspiration into the lungs.

**78. A client has been pushing effectively for two hours, but the fetal head remains at $0 \text{ station}$. The nurse recognizes that this finding is consistent with which labor pattern? (Assessment/Analysis)**
A. Prolonged latent phase
B. Arrest of descent
C. Precipitous labor
D. Prolonged active phase
**Correct Answer: B.** Arrest of descent occurs when the fetal head fails to move down (station 0 is the starting point of descent).

**79. The nurse is caring for a multigravida client in the active phase of labor. The nurse notes that the client’s cervix has not changed dilation in the last 3 hours. This pattern is classified as: (Assessment/Analysis)**
A. Hypertonic Uterine Dysfunction.
B. Secondary Arrest of Dilation.
C. Precipitous Labor.
D. Inadequate Voluntary Expulsive Forces.
**Correct Answer: B.** Secondary arrest occurs when there is "no change" (∅$\Delta$) in dilation during the active phase, usually defined as $\geq 2 \text{ hr}$ for nulliparas and multiparas.

**80. A client is admitted to the delivery unit stating she feels like something is "coming out" of her vagina. The nurse assesses the client and confirms that the uterus has inverted. The nurse anticipates the administration of which medication class prior to manually replacing the uterus? (Planning/Implementation/Safety)**
A. Uterotonics (Pitocin)
B. Narcotic Antagonists (Narcan)
C. Tocolytics (to relax the smooth muscle)
D. Vasopressors (Hydralazine)
**Correct Answer: C.** In the case of uterine inversion, tocolytics are administered to relax the smooth muscle of the uterus, allowing it to be manually replaced. Uterotonics are given *after* replacement to prevent hemorrhage.
