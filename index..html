### Group 1: Immunization and Communicable Disease Safety (ADPIE, ABC, Safety)

**1. A nurse is reviewing the immunization status of a 4-month-old infant. The nurse recognizes that which immunization should NOT be administered if the infant recently received intravenous immunoglobulins (IVIG)? (Planning/Safety)**
A. Hepatitis B (Hep B)
B. Rotavirus (RV)
C. Diphtheria, Tetanus, and Pertussis (DTaP)
D. Pneumococcal Conjugate (PCV13)
**Correct Answer: B.** Rotavirus is a live virus vaccine and is contraindicated for patients who have recently acquired passive immunity, such as through IVIG.

**2. A 3-year-old child presents to the clinic with a temperature of $103.5^\circ \text{F}$ and is scheduled for a routine vaccination. Based on general contraindications, what is the priority nursing action? (Implementation/Safety)**
A. Administer Tylenol prophylactically and proceed with vaccination.
B. Proceed with the vaccination as scheduled, focusing on distraction techniques.
C. Hold the vaccine due to severe febrile illness and notify the provider.
D. Administer the inactivated polio virus (IPV) vaccine, as it is not a live virus.
**Correct Answer: C.** A severe febrile illness is a general contraindication for receiving a vaccine.

**3. A client is scheduled to receive the influenza vaccine. The nurse identifies which patient history finding as a contraindication for administering this vaccine? (Assessment/Safety)**
A. History of mild seasonal allergies
B. History of Guillain-Barré syndrome (GBS)
C. History of local redness and swelling after the last dose
D. Current mild upper respiratory infection (URI)
**Correct Answer: B.** A history of Guillain-Barré syndrome (GBS) is a contraindication for the influenza vaccine and the meningococcal vaccine.

**4. A school-age child is admitted to the pediatric unit with suspected bacterial meningitis. Which nursing isolation precaution is the priority upon admission? (Implementation/Safety/ABC)**
A. Contact precautions only
B. Standard precautions
C. Airborne precautions
D. Droplet isolation
**Correct Answer: D.** Bacterial meningitis is transmitted by droplet, requiring droplet isolation.

**5. A child is diagnosed with Varicella (chickenpox). The nurse educates the parents that the child remains contagious until which clinical manifestation has resolved? (Planning/Safety)**
A. The fever subsides
B. The rash begins to fade
C. All vesicular lesions have crusted over
D. The patient completes the acyclovir treatment
**Correct Answer: C.** A child with Varicella is contagious until all the lesions have crusted over.

**6. The nurse is caring for an infant diagnosed with Diphtheria. Which potential complication is the priority for the nurse to monitor for, as it directly affects the circulatory system? (Assessment/Safety/C)**
A. Deafness
B. Myocarditis
C. Septic shock
D. Encephalitis
**Correct Answer: C.** Complications of Diphtheria include cardiomyopathy and septic shock.

**7. A mother reports that her infant experienced "unusual crying" (high-pitched cry) after receiving the last DTaP injection. The nurse understands this reaction may indicate a potential problem with which system? (Analysis/Safety)**
A. Respiratory system
B. Gastrointestinal system
C. Neurological system
D. Hematologic system
**Correct Answer: C.** Unusual crying, described as a high-pitched cry, following a DTaP dose may be a sign of something neurological.

**8. A nurse is teaching parents how to prevent Reye Syndrome in their children recovering from a viral illness like the flu. What teaching instruction is the most important to ensure patient safety? (Planning/Safety)**
A. Ensure the child receives adequate fluids and rest.
B. Do not give the child any medication containing salicylates (aspirin).
C. Monitor for fever and treat with non-steroidal anti-inflammatory drugs (NSAIDs).
D. Avoid contact sports until fully recovered.
**Correct Answer: B.** Aspirin (salicylates) has been linked to Reye syndrome, and parents should be taught never to give it to children or teenagers, especially if they are recovering from viral illnesses like chickenpox or the flu.

**9. A 5-year-old child presents with a fever, cough, and Koplik spots noted on the oral mucosa. The nurse recognizes the need to immediately implement precautions for Rubeola (Measles). Which isolation precaution is required? (Implementation/Safety/A)**
A. Droplet and Contact
B. Droplet only
C. Standard
D. Airborne
**Correct Answer: D.** For Rubeola (Measles), the child needs to be placed on airborne precautions.

**10. A nurse is teaching a parent about the Polio vaccine. The nurse states that the oral form of the vaccine is no longer used in the U.S. primarily because of which safety concern? (Planning/Safety)**
A. It caused severe local injection site reactions
B. It required too many doses to establish immunity
C. It increased the risk of vaccine-associated paralysis
D. It was ineffective against Polio virus type 1
**Correct Answer: C.** The oral form of the Polio vaccine was shown to increase the risk of vaccine-associated paralysis, so only the inactive virus is given now.

**11. A pregnant woman reports she needs the MMR vaccine. The nurse knows that the Measles, Mumps, and Rubella vaccine is contraindicated during pregnancy because it is classified as which type of agent? (Planning/Safety)**
A. An oral medication
B. An inactive virus suspension
C. A live virus vaccine
D. A protein conjugate
**Correct Answer: C.** The Measles part of MMR is a live virus, and it is contraindicated if the recipient is pregnant.

**12. A mother brings her 18-month-old child to the clinic for a check-up and immunizations. The child is due for the fourth dose of the Polio vaccine (IPV). The nurse correctly prepares to administer this vaccine via which route? (Implementation)**
A. Intramuscular (IM)
B. Intravenous (IV)
C. Oral (PO)
D. Subcutaneous (SQ)
**Correct Answer: D.** The inactive polio virus (IPV) vaccine is given subcutaneously (SQ).

### Group 2: Oncological Emergencies and Chemotherapy Safety (ADPIE, ABC, Safety)

**13. A child with Acute Lymphoblastic Leukemia (ALL) is receiving chemotherapy that is highly myelosuppressive. The nurse anticipates the child will be at the greatest risk for infection around the nadir, which typically occurs approximately how many days after chemotherapy administration? (Analysis/Safety)**
A. Day 3
B. Day 7
C. Day 14
D. Day 28
**Correct Answer: C.** The nadir, or lowest point of white blood cells, can be anywhere from 10 to 28 days after chemotherapy, but frequently occurs around Day 14.

**14. A child receiving chemotherapy develops a fever of $101.5^\circ \text{F}$ and has an Absolute Neutrophil Count (ANC) of 450 cells/$\text{mm}^3$. The nurse recognizes the child is at high risk for sepsis. What is the priority nursing intervention? (Implementation/ABC/Safety)**
A. Initiate neutropenic precautions and administer prescribed oral Tylenol.
B. Prepare the child for admission and initiate a septic workup, including IV antibiotics.
C. Immediately administer white blood cell stimulating factors (e.g., Neupogen).
D. Encourage high-calorie fluids and monitor temperature every 4 hours.
**Correct Answer: B.** When neutropenic children develop a fever (fever and neutropenia), they must be admitted for a septic workup, and antibiotics must be started immediately because they are at high risk for sepsis.

**15. A client receiving chemotherapy is diagnosed with thrombocytopenia, with a platelet count below 20,000/$\text{mm}^3$. The nurse understands that this value places the child at high risk for which complication? (Analysis/Safety/C)**
A. Fever and infection
B. Spontaneous bleeding
C. Delayed wound healing
D. Tumor Lysis Syndrome (TLS)
**Correct Answer: B.** If platelets are below 20,000/$\text{mm}^3$, the child is at high risk for spontaneous bleeding.

**16. A patient with Acute Lymphoblastic Leukemia (ALL) is receiving maintenance chemotherapy, which includes a corticosteroid. Which side effect requires priority cardiovascular monitoring by the nurse? (Assessment/Analysis/C)**
A. Hypokalemia
B. Hyperglycemia
C. Insomnia and mood swings
D. Osteoporosis
**Correct Answer: A.** Corticosteroids can cause cardiac side effects such as hypertension, hypernatremia, and hypokalemia. Hypokalemia can quickly lead to life-threatening arrhythmias.

**17. A nurse is preparing to administer a known vesicant chemotherapy agent through a peripheral intravenous (IV) line. Which nursing action is the MOST critical for patient safety prior to and during administration? (Implementation/Safety)**
A. Administer Tylenol (acetaminophen) to prevent fever.
B. Assess venous patency and check for blood return frequently during infusion.
C. Restrict the IV site to the bony prominences or joints.
D. Limit the infusion rate to less than $10 \text{ mL}/\text{hour}$.
**Correct Answer: B.** For vesicants, the nurse must assess venous patency and check for blood return frequently during the infusion to prevent extravasation.

**18. During the administration of a vesicant, the nurse observes signs of extravasation (erythema, pain, edema) at the peripheral IV site. What is the immediate priority nursing intervention? (Implementation/Safety)**
A. Elevate the extremity immediately to promote drainage.
B. Stop the infusion immediately and notify the provider.
C. Apply a cold pack to the site to cause vasoconstriction.
D. Remove the IV catheter immediately to prevent further infiltration.
**Correct Answer: B.** If extravasation occurs, the nurse must immediately stop the infusion, notify the provider, and initiate protocols, often leaving the catheter in place for aspiration or antidote administration.

**19. A child is scheduled for chemotherapy initiation. To prevent Hemorrhagic Cystitis, the nurse anticipates the physician will order which priority intervention? (Planning/Implementation/Safety)**
A. Initiation of allopurinol
B. Aggressive IV hydration
C. Administration of methotrexate
D. Monitoring of liver enzymes
**Correct Answer: B.** To prevent hemorrhagic cystitis (blood in the urine), which some chemotherapies can cause, patients are often hydrated aggressively, sometimes receiving a liter of fluid before the chemotherapy even starts.

**20. A 7-year-old child diagnosed with a brain tumor is admitted for debulking surgery. Postoperatively, what is the priority nursing intervention related to neurological safety (A/B/C)? (Implementation/Safety)**
A. Maintain the head of the bed in a flat position to increase cerebral perfusion.
B. Restrict visitors and maintain a dim, quiet environment.
C. Encourage deep breathing and coughing every hour.
D. Administer IV fluids liberally to prevent dehydration.
**Correct Answer: B.** For a child with cerebral compromise, the nurse should quiet and dim the lights and restrict visitors to decrease stimulation, which helps prevent increases in intracranial pressure (ICP).

**21. A child is diagnosed with a Medulloblastoma, a fast-growing tumor in the cerebellum. The nurse anticipates a priority assessment finding related to increased intracranial pressure (ICP) is: (Assessment/ABC)**
A. Generalized hyperthermia
B. Headache upon waking
C. Decreased deep tendon reflexes (DTRs)
D. Hypertension that is refractory to medication
**Correct Answer: B.** Initial symptoms of a Medulloblastoma that indicate increased ICP tend to be a headache, especially when the child wakes up, and vomiting not related to feeding.

**22. A 5-year-old with ALL is starting the maintenance phase of chemotherapy. Which intervention is the most critical to discuss with the parents regarding adherence and long-term prognosis? (Planning/Safety)**
A. Ensure the child understands the importance of daily physical activity.
B. Maintain strict adherence to the PO/IV chemotherapy regimen for two to three years.
C. Monitor for signs of peripheral neuropathy caused by the weekly IV chemo.
D. Complete nutritional supplementation to prevent growth suppression.
**Correct Answer: B.** Maintenance therapy can continue for two to three years, and adherence below 95% increases the risk for relapse.

**23. When teaching a parent about managing chemotherapy side effects, which strategy is most effective for preventing dehydration secondary to stomatitis (oral mucositis)? (Planning/Implementation/Safety)**
A. Use a hard toothbrush three times daily to remove debris.
B. Administering lidocaine mouthwash (BAX) to numb the mouth prior to meals.
C. Encourage warm, spicy foods to stimulate appetite.
D. Administering prophylactic antibiotics to prevent oral fungal infections.
**Correct Answer: B.** Mucositis/stomatitis can be very painful, leading to dehydration and weight loss because they won't eat or drink. Using a numbing mouth rinse like BAX (Benadryl, Maalox, and Lidocaine) before meals addresses the pain and encourages intake.

**24. A nurse is planning care for a hospitalized child in neutropenic isolation. Which intervention should be avoided to prevent exposure to microbes? (Planning/Safety)**
A. Ensuring frequent handwashing
B. Performing daily oral care with normal saline rinses
C. Avoiding invasive procedures like intramuscular injections
D. Using soft toothbrushes for oral hygiene
**Correct Answer: C.** When a patient is neutropenic, the nurse must avoid invasive procedures because they increase the risk of exposure to microbes.

**25. A child is scheduled for a bone marrow aspirate (BMA) and a lumbar puncture (LP) as part of a leukemia workup. The nurse understands that these diagnostic procedures are often performed simultaneously in the operating room (OR) for which reason? (Planning/Analysis)**
A. To ensure precise measurement of tumor grade and stage.
B. To monitor the child's response to the initial dose of chemotherapy.
C. To reduce the trauma and stress associated with multiple invasive procedures.
D. To immediately initiate TPN and lipids for nutritional support.
**Correct Answer: C.** The BMA, LP, and Broviac line placement are often done while the child is under anesthesia to get all three done at once, thereby reducing trauma and stress.

**26. Which finding indicates that a child with Acute Poststreptococcal Glomerulonephritis (APSGN) is experiencing the most serious complication of their renal disease? (Assessment/Safety/C)**
A. Periorbital edema and decreased appetite
B. Hypertension and signs of encephalopathy/seizures
C. Dark, tea-colored urine (hematuria)
D. Proteinuria and Azotemia
**Correct Answer: B.** Hypertensive encephalopathy and seizures are major complications that occur during the hypertensive phase of APSGN. This represents a direct threat to the central nervous system (CNS).

**27. A client is receiving high-dose radiation therapy to the pelvis for Ewing Sarcoma. The nurse teaches the parent that the most critical skin care instruction related to radiation burn is to: (Planning/Safety)**
A. Apply over-the-counter hydrocortisone cream if redness occurs.
B. Wash the affected area daily using only prescribed mild soap.
C. Use a highly scented lotion to mask the odor of tissue damage.
D. Expose the area to sunlight for short periods to promote vitamin D absorption.
**Correct Answer: B.** For radiation therapy, skin care is essential, including daily washing with a mild soap and avoiding scented products or lotions unless prescribed by the oncologist.

**28. A nurse is planning pre-procedural care for a 4-year-old scheduled for a port insertion. Which intervention aligns best with the child's developmental stage (preschooler)? (Planning/Implementation)**
A. Tell the child about the procedure one day ahead of time to allow processing.
B. Focus on concrete explanations using simple terms like "we're fixing your machine".
C. Allow the child to handle equipment and use dolls to show where the bandage will go.
D. Restrain the child immediately in the treatment room to ensure compliance.
**Correct Answer: C.** For preschoolers, play (such as using dolls or letting them touch equipment) is therapeutic and helps them cope with procedures, which is preferable to immediate restraint.

**29. The nurse reviews lab results for a child receiving chemotherapy who is experiencing gastrointestinal side effects. Which set of labs would MOST likely prompt the oncology team to postpone the next treatment cycle? (Assessment/Analysis/Safety)**
A. BUN/Creatinine WNL and Bilirubin elevated
B. Elevated Liver Enzymes (transaminases) and elevated Bilirubin
C. Hemoglobin (Hgb) $10 \text{ g}/\text{dL}$ and Platelets $150,000/\text{mm}^3$
D. $\text{ANC} > 1500 \text{ cells}/\text{mm}^3$ and $\text{WBC}$ high
**Correct Answer: B.** Elevated liver enzymes (bilirubin and transaminases) may prompt a delay in the chemotherapy schedule to prevent further harm to the liver.

**30. When reviewing the prognosis for pediatric cancers, the nurse understands that a child is considered "cured" when which criteria is met? (Analysis/Evaluation)**
A. The tumor is fully debulked during surgery.
B. The child achieves a remission induction phase.
C. There is no evidence of disease for five years.
D. The child completes the full two to three years of maintenance therapy.
**Correct Answer: C.** A child is considered cured of cancer if there is no evidence of disease after five years.

### Group 3: Respiratory Emergencies and Cystic Fibrosis (ADPIE, ABC, Safety)

**31. An infant is admitted with Respiratory Syncytial Virus (RSV) bronchiolitis. The nurse notes the infant’s respiratory rate is 72 breaths/min and uses subcostal retractions. What is the priority intervention concerning nutrition? (Implementation/ABC/Safety)**
A. Provide frequent small oral feeds to maintain hydration.
B. Administer high-caloric formula via bottle immediately.
C. Hold all oral feeds and notify the provider for potential IV/tube feeding.
D. Monitor input and output (I/O) every 8 hours.
**Correct Answer: C.** If an infant’s respiratory rate is greater than 60 breaths/min, feeds must be held due to the high risk of aspiration.

**32. The nurse is assessing a child with suspected Acute Epiglottitis. Which clinical manifestation should immediately alert the nurse to potential acute airway obstruction and necessitate calling for assistance without intervening? (Assessment/ABC/Safety)**
A. Barky, brassy cough that is worse at night
B. Low-grade fever and inspiratory stridor
C. Drooling and sitting in a tripod position
D. Slowly progressive onset of symptoms
**Correct Answer: C.** Epiglottitis is a medical emergency; drooling and the tripod position are signs of obstruction. **The nurse should avoid assessing the throat**.

**33. A child is having a severe asthma exacerbation. The nurse notes the child was wheezing upon initial assessment, but now breath sounds are diminished and barely audible. The nurse recognizes this change as indicating which immediate danger? (Analysis/ABC/Safety)**
A. The albuterol treatment is fully effective.
B. The airway is closing due to severe obstruction/spasm.
C. The child is successfully compensating for hypoxemia.
D. The obstruction has moved into the upper airway.
**Correct Answer: B.** Diminished or absent breath sounds in a child struggling to breathe, especially after wheezing, is a severe, non-reassuring sign indicating the airway is closing and warrants immediate intervention.

**34. The nurse is teaching the parents of a child newly diagnosed with Cystic Fibrosis (CF) about nutritional management. Which dietary instruction is most appropriate for promoting growth? (Planning/Implementation)**
A. Restrict fat intake to decrease steatorrhea.
B. Focus on a high protein, high calorie, unrestricted fat diet.
C. Limit breastfeeding, as formula provides more vitamins.
D. Use tube feedings exclusively until the lungs improve.
**Correct Answer: B.** CF treatment includes a diet that is high in protein and high in calories, with unrestricted fat, to combat malabsorption.

**35. A 2-year-old child presents with a distinctive "barky, brassy cough" and inspiratory stridor, with symptoms worsening overnight. The nurse anticipates the diagnosis is Acute Laryngotracheobronchitis (LTB) (Croup). Which treatment should the nurse prepare to administer? (Implementation/ABC)**
A. A non-humidified oxygen mask
B. Racemic epinephrine via nebulizer
C. Oral antipyretics only
D. Aggressive chest physiotherapy (CPT)
**Correct Answer: B.** Racemic epinephrine via nebulizer is a common treatment for LTB to help reduce subglottic edema.

**36. A nurse is administering an inhaled corticosteroid to a 6-year-old patient with persistent asthma. To minimize the risk of oral thrush (yeast infection), the nurse emphasizes the importance of which safety measure? (Planning/Safety)**
A. Administering the medication before bedtime
B. Rinsing the mouth thoroughly after use
C. Avoiding the use of a spacer device
D. Increasing the daily fluid intake
**Correct Answer: B.** Rinsing the mouth after using an inhaled corticosteroid is essential to decrease the risk of oral thrush.

**37. The nurse is performing discharge teaching for a child with a Group A Beta Hemolytic Strep (GABHS) infection who has been prescribed oral penicillin. The most important teaching point to prevent serious complications like Rheumatic Fever is: (Planning/Safety)**
A. Isolate the child from siblings for 7 days.
B. Ensure the child completes the full 10-day course of antibiotics.
C. Start the child on prophylactic steroids immediately.
D. Monitor for signs of fluid overload and edema.
**Correct Answer: B.** Completing the full 10-day course of penicillin is critical to eradicate GABHS and prevent complications like Rheumatic Fever or Glomerulonephritis.

**38. A child with Cystic Fibrosis is receiving pancreatic enzyme replacement therapy (lipase). The nurse instructs the parents to administer this medication at which time relative to meals? (Planning/Implementation)**
A. Every 8 hours, regardless of food intake
B. 30 minutes after eating large meals
C. Right before or with the first bite of meals and snacks
D. Only if the child exhibits symptoms of steatorrhea
**Correct Answer: C.** Oral pancreatic enzymes (lipase) should be given in capsules or sprinkled on food right before or with the first bite of meals and snacks.

**39. In infants, which respiratory assessment finding is considered a progression of respiratory distress, indicating increasing exhaustion and requiring prompt intervention? (Assessment/ABC)**
A. Irregular breathing patterns during sleep
B. Nasal flaring
C. Grunting
D. Head bobbing
**Correct Answer: D.** Head bobbing occurs when the infant bobs their head forward on inspiration, signifying dyspnea and progressing respiratory distress due to exhaustion.

**40. A child is admitted to the hospital with Otitis Media. The parents smoke cigarettes at home. The nurse recognizes that secondhand smoke increases the risk of this infection due to its effect on which physiological process? (Analysis/Planning)**
A. Decreased ability to clear mucus (mucociliary clearance)
B. Causing obstruction of the Eustachian tubes
C. Increasing the viscosity of middle ear secretions
D. Promoting fluid retention in the pharynx
**Correct Answer: B.** Otitis Media is associated with secondhand smoke, which contributes to the obstruction of the Eustachian tubes, leading to fluid accumulation and inflammation in the middle ear.

**41. The nurse is monitoring a 9-year-old with asthma using a peak flow meter. The child measures in the "Red Zone" on the individualized Asthma Action Plan. What is the priority nursing action? (Implementation/ABC/Safety)**
A. Call the doctor immediately, as the medication is not helping.
B. Switch to a long-acting controller medication.
C. Administer an antitussive for the severe coughing.
D. Document the reading and continue the current controller medicine.
**Correct Answer: A.** The red zone on the peak flow meter indicates that the medication is not helping, or severe symptoms are present, and the child needs immediate medical attention; the nurse must call the doctor.

**42. A child with Cystic Fibrosis develops hemoptysis (coughing up blood) due to progressive lung damage. The nurse understands this complication is primarily related to which underlying pulmonary issue? (Analysis/ABC)**
A. Increased oxygen saturation
B. Rectal prolapse
C. Pulmonary hypertension
D. Hyponatremia
**Correct Answer: C.** Complications related to the thick mucus obstruction in the lungs include compression on the pulmonary vessels, leading to pulmonary hypertension.

**43. A child is undergoing a tonsillectomy. Postoperatively, the priority assessment to monitor for potential bleeding is: (Assessment/ABC/Safety)**
A. Complaints of severe throat pain
B. Frequent swallowing
C. Low-grade fever
D. Decreased oral intake
**Correct Answer: B.** Frequent swallowing is a critical sign of potential bleeding (hemorrhage) because blood may be dripping down the back of the throat.

**44. A patient is prescribed albuterol (a Beta-adrenergic) as a rescue medication for acute asthma exacerbations. Which side effect is common and should be included in patient education? (Planning/Analysis)**
A. Drowsiness and fatigue
B. Hypotension and bradycardia
C. Irritability, nervousness, and tremors
D. Decreased need for fluid intake
**Correct Answer: C.** Common side effects of the Beta-adrenergic agent albuterol include irritability, nervousness, and tremors (shakiness).

### Group 4: Cardiovascular and Fluid Priority (ADPIE, ABC, Safety)

**45. A 4-month-old infant is admitted with suspected heart failure (HF). Which clinical manifestation is often the earliest and most recognizable sign of impaired myocardial function in an infant? (Assessment/ABC/C)**
A. Bradycardia
B. Hepatomegaly
C. Tachycardia, even at rest
D. Cool extremities with bounding pulses
**Correct Answer: C.** **Tachycardia** is recognized as the earliest cardinal sign of impaired myocardial function and heart failure in infants, sometimes observed as a heart rate above 160 even during sleep.

**46. The nurse is caring for an infant receiving Digoxin for improved cardiac contractility. Before administering the dose, the nurse checks the apical pulse and finds it to be 85 beats/minute. What is the priority nursing action? (Implementation/Safety/C)**
A. Administer the Digoxin as prescribed.
B. Hold the dose and notify the provider.
C. Administer half the dose and recheck the pulse.
D. Check peripheral pulses and capillary refill.
**Correct Answer: B.** For infants and young children, Digoxin should generally be held if the apical pulse is below 90-110 beats/minute. Since 85 beats/minute is below this standard range, holding the dose is the safest action.

**47. A child with heart failure is prescribed an Angiotensin-Converting Enzyme (ACE) inhibitor (Enalapril). The primary goal of administering this medication is to achieve which hemodynamic effect? (Analysis/Planning/C)**
A. Increase preload to enhance ventricular filling.
B. Reduce afterload by promoting systemic vasodilation.
C. Decrease systemic vascular resistance by promoting water retention.
D. Increase myocardial contractility.
**Correct Answer: B.** ACE inhibitors work as vasodilators, which reduce the systemic vascular resistance (SVR) or afterload, thereby decreasing the workload of the heart.

**48. A nurse is caring for a 5-month-old infant with a Congenital Heart Defect (CHD) who is showing signs of pulmonary congestion. The plan of care includes semi-Fowler positioning (head of bed elevated) primarily to address which ABC priority? (Implementation/ABC/B)**
A. Promote uninterrupted sleep.
B. Decrease the work of breathing.
C. Decrease cardiac demands.
D. Reduce the risk of aspiration during feeding.
**Correct Answer: B.** Positioning the child in semi-Fowler’s position helps decrease the work of breathing, allowing the chest to expand better, which is a priority for pulmonary congestion.

**49. A 7-year-old patient who underwent open heart surgery is prescribed Lasix (a loop diuretic) and Aldactone (a potassium-sparing diuretic). The nurse knows that combining a potassium-wasting and a potassium-sparing diuretic is intended to help prevent which electrolyte imbalance? (Planning/Safety/C)**
A. Hypernatremia
B. Hyperglycemia
C. Hypokalemia
D. Hypercalcemia
**Correct Answer: C.** Loop diuretics like Lasix cause potassium loss, risking hypokalemia. Aldactone spares potassium, helping to balance the potassium lost, thus preventing hypokalemia.

**50. The nurse is assessing a newborn diagnosed with Coarctation of the Aorta (CoA). Which assessment finding is the most critical indicator of the obstructive nature of this defect? (Assessment/ABC/C)**
A. Heart rate greater than 160 beats/minute
B. Blood pressure higher in the arms than the legs
C. Frequent, small volume vomiting
D. Strong femoral pulses compared to brachial pulses
**Correct Answer: B.** CoA is an obstructive defect characterized by increased pressure proximal to the defect (upper extremities) and decreased pressure distal to the defect (lower extremities), resulting in hypertension (BP in arms > BP in legs) and decreased femoral pulses.

**51. A child is experiencing a Tet Spell (hypercyanotic episode) associated with Tetralogy of Fallot. What is the immediate priority nursing intervention to increase pulmonary blood flow? (Implementation/ABC/C)**
A. Administer a large intravenous fluid bolus.
B. Place the child in a knee-to-chest position.
C. Encourage the child to push down as if having a bowel movement.
D. Prepare for immediate cardiac catheterization.
**Correct Answer: B.** Placing the child in a knee-to-chest position increases systemic vascular resistance, helping to shunt blood from the left side to the right side, forcing more blood to the lungs for oxygenation.

**52. A 10-year-old patient diagnosed with Rheumatic Fever is experiencing pain and fever. The nurse notes the prescription includes a salicylate (aspirin). The nurse understands the primary therapeutic effect of aspirin in this condition is to: (Analysis/Planning)**
A. Eradicate the Group A Beta Hemolytic Strep (GABHS) infection.
B. Treat the involuntary movements (Sydenham Chorea).
C. Decrease fever and control inflammation in the joints.
D. Prevent permanent mitral valve damage.
**Correct Answer: C.** Salicylates (Aspirin) are used in Rheumatic Fever to decrease fever and control the inflammatory process in the joints.

**53. The nurse is caring for an infant who must consume 30 $\text{kcal}/\text{oz}$ formula due to high metabolic demand from a CHD. The nurse teaches the parents that the increased caloric density is necessary primarily to: (Planning/Analysis)**
A. Decrease the risk of pulmonary congestion.
B. Reduce the frequency of feedings needed throughout the day.
C. Meet the metabolic demands of growth despite heart impairment.
D. Decrease the risk of fluid volume overload.
**Correct Answer: C.** Infants with heart failure have high metabolic demands due to growth and illness. High-caloric density formula (e.g., 24-30 $\text{kcal}/\text{oz}$) is needed to meet nutritional demands and promote growth.

**54. A child is admitted with Kawasaki’s Disease. The nurse recognizes that the most common and serious long-term sequelae affecting the cardiovascular system is: (Assessment/Analysis/C)**
A. Right-sided heart failure
B. Pulmonary artery hypertension
C. Damage to the coronary arteries
D. Mitral valve regurgitation
**Correct Answer: C.** Kawasaki's disease is the leading cause of acquired heart disease in children, and damage to the coronary arteries is the most common sequelae.

**55. A child is recovering from a cardiac catheterization performed via the femoral site. What is the priority nursing assessment immediately post-procedure? (Assessment/ABC/Safety)**
A. Assess blood pressure in all four extremities.
B. Monitor the groin site for signs of bleeding or hematoma formation.
C. Check for signs of pulmonary congestion and edema.
D. Encourage ambulation to prevent deep vein thrombosis.
**Correct Answer: B.** After a cardiac catheterization, the nurse must watch the site (groin) for bleeding and monitor circulation, sensation, and movement (CSM). Bleeding/hemorrhage is an immediate ABC concern (Circulation).

**56. A patient with Pulmonary Arterial Hypertension (PAH) is experiencing increased resistance in the pulmonary bed. The nurse anticipates that a prolonged Left-to-Right shunt defect (e.g., VSD) can eventually lead to which dangerous circulatory reversal? (Analysis/ABC/C)**
A. Hypovolemic shock
B. Hypercyanotic (Tet) spell
C. Right-to-Left shunting
D. Severe systemic hypotension
**Correct Answer: C.** Prolonged Left-to-Right shunting increases pulmonary pressures. When pulmonary pressures become higher than systemic pressures, the shunt will reverse to a Right-to-Left shunt, sending unoxygenated blood to the body.

**57. A child with heart failure is prescribed an ACE inhibitor (Enalapril) and a potassium-sparing diuretic (Aldactone). The nurse identifies that this medication combination puts the child at risk for which primary electrolyte imbalance? (Assessment/Safety/C)**
A. Hypokalemia
B. Hypernatremia
C. Hyperkalemia
D. Hyponatremia
**Correct Answer: C.** ACE inhibitors cause potassium retention, and Aldactone spares potassium. This combination increases the risk for hyperkalemia.

**58. A nurse is educating the family of an infant with heart failure about decreasing cardiac demands. Which environmental change should the nurse prioritize to achieve this goal? (Planning/Implementation/C)**
A. Encourage vigorous activity to strengthen the heart muscle.
B. Avoid cold stress by maintaining a thermo-neutral environment.
C. Ensure the infant wears extra layers of blankets.
D. Stimulate the infant frequently to prevent lethargy.
**Correct Answer: B.** Avoiding cold stress is essential because cold stress increases oxygen demand, which in turn increases the demand on the heart.

### Group 5: GI, Renal, and Fluid & Electrolytes (ADPIE, ABC, Safety)

**59. A 6-month-old infant is admitted with severe gastroenteritis leading to dehydration. The physician orders an IV fluid bolus followed by maintenance IV fluids with potassium. The nurse recognizes that potassium should NOT be added to the IV fluid until which critical physiological finding is confirmed? (Implementation/Safety)**
A. The diarrhea has stopped.
B. The infant is voiding adequately.
C. Capillary refill is less than two seconds.
D. The infant’s blood pressure stabilizes.
**Correct Answer: B.** Potassium must not be added to IV fluids until the child is voiding, as administering potassium to an anuric or oliguric patient can lead to hyperkalemia.

**60. A child presents to the emergency department with a history of diarrhea and is lethargic, hypotensive, and has a capillary refill time of 5 seconds. The nurse suspects severe Hypertonic Dehydration. This type of dehydration is most dangerous because it causes fluid to shift in which direction? (Analysis/ABC/Safety)**
A. Fluid shifts equally out of the vascular and interstitial spaces.
B. Fluid shifts from the intracellular space (ICF) into the extracellular space (ECF).
C. Fluid shifts from the vascular space into the interstitial space.
D. Fluid shifts from the vascular space into the cells.
**Correct Answer: B.** Hypertonic dehydration (water loss > electrolyte loss) results in higher blood vessel electrolytes, causing fluid to pull from inside the cell (ICF) to the extracellular space (ECF) to correct the osmolarity, leading to cellular damage.

**61. A nurse is calculating the minimum acceptable urine output for a hospitalized 15 $\text{kg}$ pediatric patient. What is the standard minimum hourly urine output required for this child? (Assessment/Analysis)**
A. $10 \text{ mL}/\text{hour}$
B. $15 \text{ mL}/\text{hour}$
C. $30 \text{ mL}/\text{hour}$
D. $45 \text{ mL}/\text{hour}$
**Correct Answer: B.** The standard minimum urine output for a pediatric patient is $1 \text{ cc}/\text{kg}/\text{hour}$, so $1 \times 15 \text{ kg} = 15 \text{ mL}/\text{hour}$.

**62. A 4-month-old infant is diagnosed with Pyloric Stenosis. The nurse anticipates a priority finding during assessment is: (Assessment)**
A. Bloody, mucousy diarrhea
B. Non-bilious, projectile vomiting
C. Sausage-shaped abdominal mass
D. Bilious vomiting indicative of obstruction
**Correct Answer: B.** Pyloric stenosis is characterized by non-bilious, projectile vomiting, often recognized between 3 weeks and 5 months.

**63. A patient has been admitted with Hemolytic Uremic Syndrome (HUS), often caused by Shiga toxin-producing E. coli. The nurse recognizes the triad of manifestations that define this condition includes: (Assessment/Analysis)**
A. Hematuria, hypertension, and fluid overload
B. Acute renal failure, hemolytic anemia, and thrombocytopenia
C. Hypotonia, lethargy, and cataracts
D. Hyperglycemia, polyuria, and polydipsia
**Correct Answer: B.** HUS is characterized by a triad of manifestations: acute renal failure, hemolytic anemia, and thrombocytopenia.

**64. A nurse is planning dietary management for a child diagnosed with Phenylketonuria (PKU). The most critical, lifelong intervention for this child is: (Planning/Implementation)**
A. Eliminating all milk products, including breast milk.
B. Restricting dietary protein intake.
C. Using a ketogenic diet (high fat, low carbohydrate).
D. Ensuring fat-soluble vitamin supplementation.
**Correct Answer: B.** PKU requires the lifelong restriction of dietary protein to manage phenylalanine levels.

**65. A child is diagnosed with Nephrotic Syndrome and is in the edema phase. The nurse monitors for generalized edema (anasarca) resulting from which pathophysiological mechanism? (Analysis/C)**
A. Increased hydrostatic pressure forcing fluid out of the vessels.
B. Massive protein loss decreasing oncotic pressure.
C. Renal failure leading to decreased Glomerular Filtration Rate (GFR).
D. Increased sodium intake causing water retention.
**Correct Answer: B.** In Nephrotic Syndrome, massive protein loss leads to decreased oncotic pressure, causing fluid to shift from the vascular space into the interstitial space and body cavities (edema/anasarca).

**66. A child is diagnosed with Hirschsprung's Disease. A key diagnostic assessment tool used to confirm the absence of ganglion cells in the distal colon is the: (Assessment/Diagnosis)**
A. Sweat Chloride test
B. Barium Enema (Lower GI Series)
C. Rectal biopsy
D. Abdominal ultrasound/CT
**Correct Answer: C.** The diagnostic tool used to confirm Hirschsprung’s disease is a rectal biopsy, which identifies the absence of ganglion cells.

**67. A nurse is teaching parents about preventing urinary tract infections (UTIs) in their 5-year-old daughter. Which teaching point is the most important regarding hygiene? (Planning/Safety)**
A. Encourage frequent bubble baths.
B. Use perfumed soaps for cleansing the perineal area.
C. Ensure she wipes from front to back after toileting.
D. Encourage holding urine to stretch the bladder.
**Correct Answer: C.** Teaching proper hygiene, specifically wiping front to back in girls, is crucial because the primary pathogen for UTIs is E. coli from the gut.

**68. A 10-month-old infant is admitted with mild isotonic dehydration. The most appropriate initial treatment for this severity level is typically: (Implementation/C)**
A. IV bolus of D5 ½ NS
B. IV bolus of Normal Saline (NS)
C. Oral rehydration solution (e.g., Pedialyte)
D. Total Parenteral Nutrition (TPN)
**Correct Answer: C.** For mild dehydration (3-5\% weight loss), oral rehydration solution (e.g., Pedialyte) is the initial treatment.

### Group 6: Neurological and Developmental Safety (ADPIE, ABC, Safety)

**69. A child with a history of epilepsy begins actively seizing in the hospital room. After noting the time and duration, what is the nurse's priority action regarding immediate safety and ABCs? (Implementation/ABC/Safety)**
A. Gently insert a tongue depressor to prevent tongue biting.
B. Administer a long-acting maintenance medication (e.g., Phenytoin).
C. Ensure the side rails are padded and place the child on their side.
D. Attempt to restrain the child's extremities to prevent injury.
**Correct Answer: C.** Seizure precautions involve padding rails, ensuring oxygen/suction are available, and positioning the child on their side to manage secretions and prevent aspiration.

**70. The nurse is caring for a 6-month-old infant with hydrocephalus who has an unclosed anterior fontanel. Which assessment finding is a critical sign of increased intracranial pressure (ICP)? (Assessment/ABC/Safety)**
A. Sunken fontanel
B. Head lag upon lifting
C. Bulging fontanel
D. Posterior fontanel pulsation
**Correct Answer: C.** In infants whose fontanelles are not fused, increased ICP or hydrocephalus is evidenced by a bulging fontanel.

**71. A nurse is reinforcing education regarding long-term home care for a toddler diagnosed with Spina Bifida and a neurogenic bladder. The priority instruction regarding urinary management is: (Planning/Implementation/Safety)**
A. Encourage holding urine to stretch the bladder.
B. Perform intermittent catheterization every four hours.
C. Avoid all fluids to decrease urinary frequency.
D. Administer daily antibiotics prophylactically for life.
**Correct Answer: B.** Due to neurogenic bladder dysfunction common with Myelomeningocele, patients often require intermittent catheterization approximately every four hours while awake and once at night to manage incontinence and retention.

**72. A child with Down Syndrome is scheduled to participate in the Special Olympics. Before participation, the nurse emphasizes the mandatory need for screening related to which specific orthopedic risk? (Planning/Safety)**
A. Scoliosis
B. Atlantoaxial Instability (AAI)
C. Transverse palmar crease defects
D. Hypotonicity of the extremities
**Correct Answer: B.** Children with Down Syndrome are at risk for Atlantoaxial Instability (AAI), a type of spinal cord compression, and must be screened (usually by X-ray) before high-risk activities like the Special Olympics.

**73. A toddler in the hospital is demonstrating severe separation anxiety and has entered the phase of Despair. The nurse observes which behavior characteristic of this phase? (Assessment/Analysis)**
A. Screaming aggressively and resisting strangers
B. Appearing happy and interacting freely with staff
C. Becoming withdrawn, inactive, and possibly regressing (e.g., thumb sucking)
D. Showing interest in surrounding toys and games
**Correct Answer: C.** The despair phase of separation anxiety involves the child becoming inactive, withdrawn, not communicating, and possibly regressing.

**74. The nurse is teaching the parent of a 9-year-old (school-age) about pain management after a minor surgical procedure. Which teaching point is most appropriate for this developmental stage? (Planning/Implementation)**
A. They are literal thinkers, so avoid telling them a shot will hurt.
B. Pain medication should be held until behavioral signs of pain are obvious.
C. Allowing them to use the Numeric Pain Scale for self-reporting pain is most accurate.
D. Distraction using toys is ineffective for this age group.
**Correct Answer: C.** School-age children are generally capable of self-reporting pain using rating scales, and the numeric pain scale is typically used for children 8 years and older.

**75. A 2-year-old child (toddler) is exhibiting negative and non-compliant behavior regarding treatments. To promote a sense of autonomy and cooperation, what is the best nursing approach? (Implementation)**
A. Immediately perform the treatment using firm restraint to establish control.
B. Offer a choice between performing the treatment now or after breakfast.
C. Explain the full rationale for the treatment in complex scientific terms.
D. Ignore the child's distress and focus only on the parent.
**Correct Answer: B.** Offering choices, such as timing of a procedure, helps toddlers gain a sense of control (autonomy vs. shame and doubt) and often leads to compliance.

**76. A child is admitted to the hospital after a near-drowning incident (submersion injury). The nurse understands that the most critical factor dictating the child’s prognosis and treatment plan is: (Analysis/ABC/Safety)**
A. The amount and type of fluid aspirated.
B. The progression of hypothermia.
C. The length of submersion causing irreversible neurological damage.
D. The progression to metabolic acidosis.
**Correct Answer: C.** Irreversible neurological damage occurs within four to six minutes of submersion, making the length of submersion the critical factor dictating the treatment plan.

**77. A nurse is planning safety measures for a child recently discharged home who has a history of seizures. What is the most critical instruction regarding bathing? (Planning/Safety)**
A. They must take baths only, not showers.
B. Showers are safe, but they must use a waterproof phone.
C. They must shower instead of taking a bath to prevent drowning.
D. They must only bathe when a family member is in the next room.
**Correct Answer: C.** At home, children with seizures should shower and not bathe to prevent drowning if a seizure were to occur in the bathtub.

**78. When assessing an infant for potential growth problems, the nurse compares the weight against the birth weight. The nurse expects a normal, healthy infant's birth weight to have achieved which milestone by 12 months of age? (Assessment/Analysis)**
A. Doubled
B. Tripled
C. Quadrupled
D. Remain unchanged
**Correct Answer: B.** A normal, healthy infant's birth weight should have tripled by one year of age.

**79. A nurse is educating the parents of a toddler about anticipatory guidance for toilet training. Which milestone is typically achieved first? (Planning/Analysis)**
A. Day dryness
B. Night dryness
C. Bowel control
D. Verbal communication of the need to go
**Correct Answer: C.** Children are typically able to achieve bowel control before they achieve urine control (day or night dryness).

**80. Which finding during a pediatric neuro assessment is considered a **normal** response in a 1-year-old child? (Assessment/Analysis)**
A. Irregular abdominal breathing patterns
B. Positive Babinski reflex
C. Absence of the rooting reflex
D. All of the above
**Correct Answer: D.** Irregular abdominal breathing is normal in infants/toddlers up to age 4. The Babinski reflex is normally gone between age 1 and 2. The rooting reflex is normally gone between 3 and 4 months. Since the child is 1 year old, they could potentially display the first two normally, and the absence of the rooting reflex is also normal for this age. Therefore, *All of the above* is the most comprehensive correct answer demonstrating the understanding of normal findings for this age group.

### Group 1: Cardiovascular Disorders and Heart Failure (10 Questions)

**1. A nurse is planning care for a client newly diagnosed with chronic heart failure (CHF). The nurse recognizes that the primary goal of pharmacological therapy is to decrease the workload on the heart by primarily targeting which physiological measurement? (Planning/Analysis/C)**
A. Increasing contractility by raising the ejection fraction (EF) to $85\%$.
B. Reducing preload and afterload.
C. Stimulating the Sympathetic Nervous System (SNS).
D. Increasing the venous return to the right side of the heart.
**Correct Answer: B.** ACE inhibitors, the flagship agents for heart failure management, decrease both preload (by enhancing $\text{Na}^{+}$ and water excretion) and afterload (by dilating arteries).

**2. A client with severe heart failure suddenly reports increased shortness of breath (SOB) and is visibly anxious. The nurse notes new crackles (rales) upon auscultation of the lung fields. These findings are characteristic of which type of heart failure? (Assessment/Analysis/B)**
A. Systolic dysfunction with low ejection fraction (EF).
B. Left-sided heart failure (backward failure),.
C. Right-sided heart failure (systemic congestion),.
D. Mixed cardiomyopathy with decreased contractility.
**Correct Answer: B.** Left-sided heart failure causes blood to back up into the pulmonary circulation, forcing fluid into the lungs, leading to pulmonary congestion (crackles/rales) and dyspnea,.

**3. The nurse is monitoring a client admitted with acute decompensated heart failure (ADHF). The client's lab results show a Brain Natriuretic Peptide (BNP) level of $850 \text{ pg}/\text{mL}$. The nurse understands that this value is significant for which reason? (Assessment/Analysis/C)**
A. It indicates end-stage (Stage D) heart failure.
B. It rules out a non-cardiac cause for the patient's dyspnea.
C. It confirms increased ventricle filling and stretching, strongly suggesting heart failure.
D. It is used to monitor potassium levels that could cause arrhythmias.
**Correct Answer: C.** BNP is released from the ventricles when there is increased filling or stretching, making it a great lab tool to see if someone is in heart failure. A BNP above $500 \text{ pg}/\text{mL}$ is generally concerning.

**4. A client with chronic heart failure is receiving Furosemide (Lasix) $40 \text{ mg}$ IV. The nurse understands that the primary physiological mechanism by which this diuretic improves heart failure symptoms is by: (Analysis/Implementation)**
A. Blocking aldosterone in the renal tubules.
B. Increasing afterload to improve systemic pressure.
C. Decreasing preload by eliminating volume,.
D. Stimulating the release of ADH to retain water.
**Correct Answer: C.** Diuretics decrease preload by reducing volume, thus decreasing the work of the failing heart, which is the number one intervention for acutely ill heart failure patients,.

**5. A nurse administers Digoxin ($0.25 \text{ mg}$ PO) to a client with systolic heart failure. Before administration, the nurse takes the apical pulse and finds it to be 58 beats/minute. What is the priority nursing action? (Implementation/Safety/C)**
A. Administer the medication and document the heart rate.
B. Administer the dose and anticipate giving an antidote.
C. Hold the dose and notify the provider of potential bradycardia.

D. Buttocks.
**Correct Answer: B.** The preferred adipose tissue sites for subcutaneous insulin injection are the abdominal wall, upper arms, thighs, and buttocks. The abdominal wall typically offers the quickest absorption.

**61. A client with Type 2 DM who is managed with insulin reports experiencing night sweats, nightmares, and a headache upon rising. The nurse suspects Somogyi Syndrome. Which intervention is indicated to resolve this phenomenon? (Planning/Analysis/Safety)**

B. Decreasing the evening insulin dose.

**Correct Answer: B.** Somogyi Syndrome involves nighttime hypoglycemia followed by a rebound hyperglycemia. Treatment involves decreasing the evening insulin dose to prevent the initial hypoglycemic event.

**62. A client is receiving Total Parenteral Nutrition ($\text{TPN}$). The nurse must be aware that suddenly discontinuing $\text{TPN}$ can lead to which acute metabolic complication? (Implementation/Safety)**

**Correct Answer: D.** $\text{TPN}$ must never be discontinued abruptly; it must be tapered to prevent rebound hypoglycemia.

**63. When caring for a client with a nasogastric tube ($\text{NGT}$) set to low wall suction ($\text{LWS}$), the nurse understands that the tube is double-lumened to serve which purpose? (Analysis/Implementation/Safety)**

**64. A client is receiving continuous enteral tube feeding ($\text{TF}$). The nurse must elevate the head of the bed to $35^{\circ}$ to $45^{\circ}$ primarily to prevent which potentially life-threatening mechanical complication? (Implementation/ABC/A)**

**67. A client receiving high-dose chemotherapy has a platelet count of $45,000/\text{mm}^3$ (Thrombocytopenia). Which nursing intervention should the nurse prioritize? (Implementation/Safety/C)**

B. Monitoring for fever and signs of infection.

**Correct Answer: C.** Thrombocytopenia (low platelets) increases the risk of spontaneous bleeding and injury. The nurse must implement safety measures and limit invasive procedures,.

**68. A client is diagnosed with Hemolytic Anemia. The nurse understands that when red blood cells are prematurely destroyed, which substance is released and filtered by the kidney, potentially leading to renal failure? (Analysis/Safety)**
A. Bilirubin.
B. Potassium ($\text{K}^{+}$).
C. Hemoglobin molecules.
D. Erythropoietin.
**Correct Answer: C.** When red blood cells are destroyed (hemolysis), the hemoglobin molecule is released and filtered by the kidney. This process can lead to tubular necrosis or renal failure.

**69. A client is receiving an intravenous infusion of Vancomycin. The nurse observes flushing and itching of the client’s face, neck, and upper trunk. The nurse’s priority action is to: (Implementation/Safety)**

B. Obtain peak and trough levels immediately.

**Correct Answer: C.** Flushing/itching of the face/neck (Redman syndrome) may occur during Vancomycin infusion. The nurse must stop the infusion and assess the patient. If the patient is stable, antihistamines may be given, and the infusion can continue more slowly,.

**70. A client with a suspected severe infection is prescribed Gentamicin (an aminoglycoside). The nurse prioritizes monitoring which laboratory results for signs of serious toxicity? (Assessment/Safety/D)**
A. Serum Potassium and Magnesium.
B. Liver Function Tests (LFTs).
C. $\text{WBC}$ count and differential.
D. $\text{BUN}$ and serum Creatinine,.
**Correct Answer: D.** Aminoglycosides (ending in "-mycin," such as Gentamicin) have two serious adverse effects: ototoxicity and nephrotoxicity. Nephrotoxicity is monitored by checking the $\text{BUN}$ and serum creatinine levels,,.

**71. A client is being discharged with a prescription for a Quinolone antibiotic (Ciprofloxacin). The nurse provides safety teaching about a serious black box warning associated with this medication class: (Planning/Safety)**
A. Risk for fatal heart arrhythmias.
B. Increased risk of spontaneous tendon rupture,.
C. Discoloration of teeth in children under age eight.
D. Increased risk of bleeding if taken with Warfarin.
**Correct Answer: B.** Quinolones carry a black box warning due to reported incidents of spontaneous tendon ruptures, especially problematic for the elderly,.

**72. A nurse is preparing to give an antibiotic to a client who has a known allergy to Penicillin. The nurse should notify the provider if the client is prescribed which other class of antimicrobials due to potential cross-reactivity? (Planning/Safety)**
A. Macrolides.
B. Tetracyclines.
C. Sulfonamides.
D. Cephalosporins,.
**Correct Answer: D.** Cephalosporins are structurally and pharmacologically similar to penicillins. Clients allergic to penicillin may have a cross-reactivity and allergy to cephalosporins, requiring the nurse to consider another antibiotic class,,.

**73. A client with Iron Deficiency Anemia is taking oral iron supplements. The nurse advises the client to take the iron with which beverage to maximize absorption? (Planning/Implementation)**
A. Milk or a dairy product,.
B. Orange juice.
C. Black tea.
D. A calcium-containing antacid.
**Correct Answer: B.** Absorption of oral iron is enhanced when taken with orange juice or one hour before meals,.

**74. A nurse is monitoring a client's central venous catheter ($\text{CVC}$) to prevent a Central Line-Associated Bloodstream Infection ($\text{CLABSI}$). The most critical safety measure when accessing the port is known as the: (Implementation/Safety)**

      const { useState, useEffect, useMemo } = React;

      // Helper to clean LaTeX-like formatting for better readability
      const cleanText = (text) => {
        if (!text) return "";
        let cleaned = text;

        // 1. Handle explicit symbol replacements first
        cleaned = cleaned
          .replace(/\\geq/g, "≥")
          .replace(/\\leq/g, "≤")
          .replace(/\\cong/g, "≅")
          .replace(/\\circ/g, "°")
          .replace(/\\Delta/g, "Δ")
          .replace(/\\downarrow/g, "↓")
          .replace(/\\uparrow/g, "↑")
          .replace(/\\pm/g, "±")
          .replace(/\\times/g, "×")
          .replace(/\\approx/g, "≈")
          .replace(/\\neq/g, "≠");

        // 2. Remove \text{...} wrappers.
        // We do this loop to catch nested braces if simple regex fails,
        // though your text bank seems simple: \text{Content}
        cleaned = cleaned.replace(/\\text\s*\{([^}]+)\}/g, "$1");

        // 3. Remove dollar signs used for math mode
        cleaned = cleaned.replace(/\$([^$]+)\$/g, "$1");

        // 4. Cleanup remaining artifacts
        cleaned = cleaned
          // Remove subscripts/superscripts indicators
          .replace(/[_^]/g, "")
          // Remove lingering curly braces
          .replace(/[{}]/g, "")
          // Remove any leftover backslashes
          .replace(/\\/g, "")
          // Normalize spaces
          .replace(/\s+/g, " ")
          .trim();

        return cleaned;
      };

      const QuestionParser = (raw) => {
        if (!raw || raw.length < 100) return [];

        const sections = [
          { id: "OB", name: "OB/L&D", start: 0, end: raw.length },
          {
            id: "PEDS",
            name: "Pediatrics",
            start: raw.length,
            end: raw.length,
          },
          {
            id: "MEDSURG",
            name: "Med/Surg",
            start: raw.length,
            end: raw.length,
          },
        ];

        // Find delimiters
        const pedsIndex = raw.indexOf("//Pediatrics begin");
        const medSurgIndex = raw.indexOf("//MedSurg Begin");

        if (pedsIndex !== -1) {
          sections[0].end = pedsIndex;
          sections[1].start = pedsIndex;
          if (medSurgIndex !== -1) {
            sections[1].end = medSurgIndex;
            sections[2].start = medSurgIndex;
          }
        } else if (medSurgIndex !== -1) {
          // If peds missing for some reason
          sections[0].end = medSurgIndex;
          sections[2].start = medSurgIndex;
        }

        let allQuestions = [];

        sections.forEach((section) => {
          const sectionText = raw.substring(section.start, section.end);
          const lines = sectionText.split("\n");
          let currentQ = null;

          lines.forEach((line) => {
            line = line.trim();
            if (!line) return;

            // Detect Start of Question: "**1. " or "** 1. "
            const qStartMatch = line.match(/^\*\*(\d+)\.\s+(.*)/);
            if (qStartMatch) {
              // Save previous if exists
              if (currentQ) allQuestions.push(currentQ);

              // Start new
              currentQ = {
                id: parseInt(qStartMatch[1]),
                category: section.id,
                text: cleanText(qStartMatch[2].replace(/\*\*$/, "")), // Remove trailing ** if present
                options: {},
                answer: null,
                rationale: "",
              };
              return;
            }

            if (!currentQ) return;

            // Detect Options: "A. ", "B. ", etc.
            const optMatch = line.match(/^([A-D])\.\s+(.*)/);
            if (optMatch) {
              currentQ.options[optMatch[1]] = cleanText(optMatch[2]);
              return;
            }

            // Detect Answer: "**Correct Answer: C.**"
            const ansMatch = line.match(
              /\*\*Correct Answer:\s*([A-D])\.?\*\*(.*)/
            );
            if (ansMatch) {
              currentQ.answer = ansMatch[1];
              currentQ.rationale = cleanText(ansMatch[2]);
              return;
            }

            // If it's a continuation of rationale
            if (
              currentQ.answer &&
              !line.startsWith("***") &&
              !line.startsWith("###")
            ) {
              currentQ.rationale += " " + cleanText(line);
            }
            // If it's a continuation of question text (before options)
            else if (
              !Object.keys(currentQ.options).length &&
              !line.startsWith("***") &&
              !line.startsWith("###")
            ) {
              currentQ.text += " " + cleanText(line);
            }
          });
          // Push last question
          if (currentQ) allQuestions.push(currentQ);
        });

        return allQuestions.filter(
          (q) => q.answer && Object.keys(q.options).length >= 2
        );
      };

        if (mode === "RESULTS") {

          return (

        // QUIZ MODE

                <button
                  onClick={restart}
                  className="text-gray-400 hover:text-gray-600"
                >
                  <Icon name="X" size={24} />
                </button>
                <div className="text-sm font-semibold text-gray-500">
                  {currentCategory === "ALL" ? "Comprehensive" : currentQ.name}
                </div>
                <div className="text-sm font-semibold text-indigo-600">
                  {currentIndex + 1} / {quizQuestions.length}
                </div>
              </div>

              {/* Progress Bar */}
              <div className="w-full bg-gray-200 h-2 rounded-full mb-6 overflow-hidden">
                <div
                  className="bg-indigo-500 h-full transition-all duration-300"
                  style={{ width: `${progress}%` }}
                ></div>
              </div>

              {/* Question Card */}
              <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6">
                <h3 className="text-lg md:text-xl font-medium text-gray-800 leading-relaxed">
                  {currentQ.text}
                </h3>
              </div>

              {/* Options */}
              <div className="space-y-3 mb-20">
                {["A", "B", "C", "D"].map((opt) => {
                  const isSelected = selectedOption === opt;
                  const isCorrect = currentQ.answer === opt;
                  const showCorrectness = showRationale;

                  let btnClass =
                    "w-full p-4 rounded-xl text-left border-2 transition-all relative ";

                  if (showCorrectness) {
                    if (isCorrect) {
                      btnClass += "bg-green-50 border-green-500 text-green-800";
                    } else if (isSelected && !isCorrect) {
                      btnClass += "bg-red-50 border-red-500 text-red-800";
                    } else {
                      btnClass +=
                        "bg-gray-50 border-transparent text-gray-400 opacity-70";
                    }
                  } else {
                    if (isSelected) {
                      btnClass +=
                        "bg-indigo-50 border-indigo-500 text-indigo-900";
                    } else {
                      btnClass +=
                        "bg-white border-transparent shadow-sm hover:bg-gray-50 text-gray-700";
                    }
                  }

                  return (
                    <button
                      key={opt}
                      onClick={() => handleAnswer(opt)}
                      disabled={showRationale}
                      className={btnClass}
                    >
                      <div className="flex items-start">
                        <span
                          className={`flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold mr-3 ${
                            showCorrectness && isCorrect
                              ? "bg-green-200 text-green-700"
                              : showCorrectness && isSelected
                              ? "bg-red-200 text-red-700"
                              : "bg-gray-100 text-gray-500"
                          }`}
                        >
                          {opt}
                        </span>
                        <span className="mt-1">{currentQ.options[opt]}</span>

                        {showCorrectness && isCorrect && (
                          <div className="absolute right-4 top-4 text-green-600">
                            <Icon name="CheckCircle" size={24} />
                          </div>
                        )}
                      </div>
                    </button>
                  );
                })}
              </div>

              {/* Rationale / Next Button Area */}
              {showRationale && (
                <div className="fixed bottom-0 left-0 right-0 bg-white border-t shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] p-4 z-50 animate-in slide-in-from-bottom duration-300">
                  <div className="max-w-2xl mx-auto">
                    <div className="mb-4 max-h-40 overflow-y-auto custom-scroll pr-2">
                      <h4 className="text-sm font-bold text-gray-500 uppercase tracking-wider mb-1">
                        Rationale
                      </h4>
                      <p className="text-gray-800 leading-relaxed">
                        <span className="font-bold mr-2">
                          {currentQ.answer} is correct.
                        </span>
                        {currentQ.rationale}
                      </p>
                    </div>
                    <button
                      onClick={nextQuestion}
                      className="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-bold text-lg hover:bg-indigo-700 active:scale-[0.99] transition-all shadow-md flex items-center justify-center gap-2"
                    >
                      <span>Next Question</span>
                      <Icon name="ArrowRight" size={20} />
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
